        "number": 36,
        "title": "Câu 36",
        "contentHtml": "<ul><li><em>Dịch câu hỏi:</em> Những đứa trẻ bế chậu hoa nở rực rỡ cúi gầm đầu xuống là vì:</li><li><strong>A. 偷换了别人的鲜花</strong> (<em>Tōuhuàn le biérén de xiānhuā</em>): Tráo đổi hoa tươi của người khác[3].</li><li><strong>B. 因未被选中而难过</strong> (<em>Yīn wèi bèi xuǎnzhòng ér nánguò</em>): Buồn vì không được chọn[3].</li><li><strong>C. 鲜花不是自己种的</strong> (<em>Xiānhuā bú shì zìjǐ zhòng de</em>): Hoa tươi không phải do tự mình trồng[3].</li><li><strong>D. 因欺骗而感到羞愧</strong> (<em>Yīn qīpiàn ér gǎndào xiūkuì</em>): Cảm thấy xấu hổ vì gian dối[3].</li></ul><hr><h3>4\\. Đáp án đúng &amp;amp; Giải thích</h3><ul><li><strong>Câu 34: Đáp án C</strong>[2][3]</li><li><em>Giải thích ngắn gọn:</em> Bài nghe tiết lộ lời quốc vương: \"Hạt giống ta phát ra toàn bộ đều đã luộc qua rồi, vốn dĩ không thể nào nảy mầm nở hoa\" (<em>我发下的种子全部都是煮过的，根本就不可能发芽开花</em>)[2].</li><li><strong>Câu 35: Đáp án C</strong>[2][3]</li><li><em>Giải thích ngắn gọn:</em> Quốc vương thử thách lòng trung thực của các đứa trẻ; cậu bé mang chậu hoa rỗng đã thật thà không tráo đổi hạt giống khác, thể hiện phẩm chất trung thực (<em>诚实</em>)[2].</li><li><strong>Câu 36: Đáp án D</strong>[2][3]</li><li><em>Giải thích ngắn gọn:</em> Những đứa trẻ khác vì muốn được chọn nên đã tự ý tráo hạt giống/hoa khác. Khi sự thật hạt giống gốc bị luộc chín bị tiết lộ, họ cảm thấy xấu hổ vì hành vi gian dối của mình (<em>因欺骗而感到羞愧</em>)[2].</li></ul><hr><p>🐎 Bạn có muốn tiếp tục giải đoạn văn tiếp theo <strong>(Câu 37–39 về truyền thuyết và bí ẩn của Giống ngựa Hãn Huyết / 汗血宝马)</strong> không?</p><p>Làm tiếp câu 37 đến câu 39 nhé</p><p>Dưới đây là chi tiết phân tích <strong>Câu 37 đến Câu 39 (Đề số 1)</strong> thuộc Phần 3 (Chủ đề: <em>Truyền thuyết và bí ẩn của giống ngựa Hãn Huyết / 汗血宝马</em>):</p><hr><h3>1\\. Từ vựng trọng tâm</h3><ul><li><strong>汗血宝马</strong> (<em>hàn xuè bǎo mǎ</em>): Ngựa Hãn Huyết (ngựa mồ hôi máu).</li><li><strong>驯养</strong> (<em>xùn yǎng</em>): Thuần dưỡng, chăn nuôi.</li><li><strong>言过其实</strong> (<em>yán guò qí shí</em>): Nói quá sự thật, khoa trương.</li><li><strong>淋漓尽致</strong> (<em>lín lí jìn zhì</em>): Bộc lộ/mô tả triệt để, trọn vẹn, sinh động.</li><li><strong>长途跋涉</strong> (<em>cháng tú bá shè</em>): Di chuyển đường xa bôn ba.</li><li><strong>寄生虫</strong> (<em>jì shēng chóng</em>): Ký sinh trùng.</li><li><strong>错觉</strong> (<em>cuò jué</em>): Ảo giác, sự nhầm lẫn về thị giác.</li></ul><hr><h3>2\\. Đoạn văn gốc (Bài nghe Câu 37–39)</h3><ul><li><strong>Tiếng Trung nguyên văn:</strong> 汗血宝马产自土库曼斯坦科佩特山脉和卡拉库姆沙漠间的阿尔泰绿洲，至今已有3000多年的驯养历史。</li><li><strong>Pinyin:</strong> Hànxuè bǎomǎ chǎn zì Tǔkùmànsītǎn Kēpèitè Shānmài hé Kǎlākùmù Shāmò jiān de Ā'ěrtài lǜzhōu, zhìjīn yǐ yǒu 3000 duō nián de xùnyǎng lìshǐ.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Ngựa Hãn Huyết có nguồn gốc từ ốc đảo Altai nằm giữa dãy núi Kopet Dag và sa mạc Karakum ở Turkmenistan, đến nay đã có lịch sử thuần dưỡng hơn 3.000 năm[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 据史料记载，这种马奔跑时，脖颈部位流出的汗中有红色物质，鲜红似血，因此称为汗血宝马。</li><li><strong>Pinyin:</strong> Jù shǐliào jìzǎi, zhè zhǒng mǎ bēnpǎo shí, bógěng bùwèi liúchū de hàn zhōng yǒu hóngsè wùzhì, xiānhóng sì xuè, yīncǐ chēngwéi Hànxuè bǎomǎ.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Theo ghi chép trong sử sách, khi giống ngựa này phi nhanh, mồ hôi chảy ra ở vùng cổ có chứa chất màu đỏ, đỏ tươi như máu, nên được gọi là ngựa Hãn Huyết[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 传说汗血宝马日行千里，夜走八百。虽然经现代科学家考证这种说法言过其实，但传说却形象地把汗血宝马速度快、耐力强的特点描绘得淋漓尽致。</li><li><strong>Pinyin:</strong> Chuánshuō Hànxuè bǎomǎ rì xíng qiān lǐ, yè zǒu bā bǎi. Suīrán jīng xiàndài kēxuéjiā kǎozhèng zhè zhǒng shuōfǎ yánguòqíshí, dàn chuánshuō què xíngxiàng de bǎ Hànxuè bǎomǎ sùdù kuài, nàilì qiáng de tèdiǎn miáohuì de línlí-jìnzhì.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Truyền thuyết nói rằng ngựa Hãn Huyết ngày đi nghìn dặm, đêm đi tám trăm dặm. Mặc dù qua khảo chứng của các nhà khoa học hiện đại thì cách nói này là khoa trương, nhưng truyền thuyết đã khắc họa một cách sinh động đặc điểm tốc độ nhanh, sức bền mạnh của nó[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 经测算，汗血宝马在平地上跑1000米仅需1分07秒，速度之快令人惊叹。</li><li><strong>Pinyin:</strong> Jīng cèsuàn, Hànxuè bǎomǎ zài píngdì shàng pǎo 1000 mǐ jǐn xū 1 fēn 07 miǎo, sùdù zhī kuài lìngrén jīngtàn.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Theo đo đạc, ngựa Hãn Huyết chạy 1.000 mét trên đường bằng chỉ mất 1 phút 07 giây, tốc độ nhanh đến mức kinh ngạc[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 最让人惊奇的是它的耐力，或许是因为其先祖为栖息于沙漠戈壁地带的野马的缘故，这种马非常耐渴，即使在50摄氏度的高温下，一天也只需喝一次水，因此特别适合长途跋涉。</li><li><strong>Pinyin:</strong> Zuì ràng rén jīngqí de shì tā de nàilì, huòxǔ shì yīnwèi qí xiānzǔ wéi qīxī yú shāmò gēbì dìdài de yěmǎ de yuángù, zhè zhǒng mǎ fēicháng nài kě, jíshǐ zài 50 shèshìdù de gāowēn xià, yī tiān yě zhǐ xū hē yī cì shuǐ, yīncǐ tèbié shìhé chángtú báshè.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Điều làm con người kinh ngạc nhất là sức bền của nó, có lẽ vì tổ tiên của nó là giống ngựa hoang sinh sống ở vùng sa mạc Gobi, giống ngựa này rất chịu khát, cho dù dưới nhiệt độ cao 50度 C thì một ngày cũng chỉ cần uống nước một lần, do đó đặc biệt thích hợp di chuyển đường xa[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 汗血宝马最让人好奇的莫过于它奔跑时会流“血”。清朝人德效骞将“汗血”解释为马病所致，他认为有一种寄生虫，特别喜欢寄生于马的臀部和背部，它能钻入马皮内，因而马皮在两个小时之内就会出现往外渗的小包。</li><li><strong>Pinyin:</strong> Hànxuè bǎomǎ zuì ràng rén hàoqí de mòguòyú tā bēnpǎo shí huì liú \"xuè\". Qīngcháo rén Dé Xiàoqiān jiāng \"hànxuè\" jiěshì wéi mǎ bìng suǒ zhì, tā rènwéi yǒu yī zhǒng jìshēngchóng, tèbié xǐhuan jìshēng yú mǎ de túnbù hé bèibù, tā néng zuān rù mǎ pí nèi, yīn'ér mǎ pí zài liǎng gè xiǎoshí zhī nèi jiù huì chūxiàn wǎng wài shèn de xiǎo bāo.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Điều khiến mọi người tò mò nhất ở ngựa Hãn Huyết chính là việc nó chảy \"máu\" khi chạy. Đức Hiệu Khiên thời nhà Thanh giải thích hiện tượng \"mồ hôi máu\" là do bệnh ở ngựa, ông cho rằng có một loại ký sinh trùng rất thích ký sinh ở mông và lưng ngựa, có thể chui vào trong da ngựa, làm cho da ngựa xuất hiện những nốt bọc nhỏ rỉ ra ngoài trong vòng hai giờ[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 德效骞的这种观点得到部分外国专家的认同，但如果是寄生虫作祟，应该可以通过科学仪器观察到，而目前对这种寄生虫还一无所知。</li><li><strong>Pinyin:</strong> Dé Xiàoqiān de zhè zhǒng guāndiǎn dédào bùfen wàiguó zhuānjiā de rèntóng, dàn rúguǒ shì jìshēngchóng zuòsuì, yīnggāi kěyǐ tōngguò kēxué yíqì guānchá dào, ér mùqián duì zhè zhǒng jìshēngchóng hái yīwúsuǒzhī.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Quan điểm này của Đức Hiệu Khiên nhận được sự đồng tình của một số chuyên gia nước ngoài, nhưng nếu là do ký sinh trùng gây ra thì đáng lẽ có thể quan sát được qua thiết bị khoa học, trong khi hiện nay người ta vẫn chưa biết gì về loại ký sinh trùng này[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 另有学者认为，汗血宝马在奔跑时体温上升，使得少量红色血浆从毛孔中渗出，出现“汗血”现象。反驳这一观点的人认为，如果汗血真是流血所致，那每一次日行千里或夜走八百，岂不是要让一匹宝马鲜血流尽而死？</li><li><strong>Pinyin:</strong> Lìng yǒu xuézhě rènwéi, Hànxuè bǎomǎ zài bēnpǎo shí tǐwēn shàngshēng, shǐde shǎoliàng hóngsè xuèjiāng cóng máokǒng zhōng shènchū, chūxiàn \"hànxuè\" xiànxiàng. Fǎnbó zhè yī guāndiǎn de rén rènwéi, rúguǒ hànxuè zhēn shì liúxuè suǒ zhì, nà měi yī cì rì xíng qiān lǐ huò yè zǒu bā bǎi, qǐ bú shì yào ràng yī pǐ bǎomǎ xiānxuè liújìn ér sǐ?</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Lại có học giả cho rằng khi ngựa Hãn Huyết phi nhanh, nhiệt độ cơ thể tăng lên khiến một lượng nhỏ huyết tương màu đỏ rỉ ra từ lỗ chân lông, xuất hiện hiện tượng \"mồ hôi máu\". Những người phản bác quan điểm này cho rằng nếu mồ hôi máu thực sự là do chảy máu thì mỗi lần ngày đi nghìn dặm hay đêm đi tám trăm dặm, chẳng phải sẽ khiến một con ngựa quý chảy hết máu mà chết sao[1]?</li><li><strong>Tiếng Trung nguyên văn:</strong> 汗血宝马发源地土库曼斯坦的养马专家对“汗血”的解释颇令人信服：他们认为汗血宝马的皮肤较薄，奔跑时血液在血管中流动很容易被看到；另外马的肩部和颈部汗腺发达，出汗时往往先潮湿，出汗后局部颜色会显得更加鲜艳，给人以流血的错觉。</li><li><strong>Pinyin:</strong> Hànxuè bǎomǎ fāyuándì Tǔkùmànsītǎn de yǎngmǎ zhuānjiā duì \"hànxuè\" de jiěshì pō lìngrén xìnfú: tāmen rènwéi Hànxuè bǎomǎ de pífū jiào báo, bēnpǎo shí xuèyè zài xuèguǎn zhōng liúdòng hěn róngyì bèi kàndào; lìngwài mǎ de jiānbù hé jǐngbù hànxiàn fādá, chūhàn shí wǎngwǎng xiān cháoshī, chūhàn hòu júbù yánsè huì xiǎnde gèngjiā xiānyàn, gěi rén yǐ liúxuè de cuòjué.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Các chuyên gia nuôi ngựa ở Turkmenistan (quê hương của ngựa Hãn Huyết) đưa ra lời giải thích khá thuyết phục: Họ cho rằng da ngựa Hãn Huyết tương đối mỏng, khi chạy máu chảy trong mạch máu rất dễ nhìn thấy; ngoài ra tuyến mồ hôi ở vai và cổ ngựa rất phát triển, khi ra mồ hôi thường ẩm ướt trước, sau khi ra mồ hôi màu sắc vùng đó trông sẽ tươi tắn hơn, tạo cho người ta ảo giác như đang chảy máu[1].</li></ul><hr><h3>3\\. Phương án lựa chọn A–D</h3>"
      },
      {
        "number": 37,
        "title": "Câu 37",
        "contentHtml": "<ul><li><em>Dịch câu hỏi:</em> Ngựa Hãn Huyết nhờ đâu/vì sao mà có tên gọi này?</li><li><strong>A. 快速奔跑时脖颈部会流出鲜红血液</strong> (<em>Kuàisù bēnpǎo shí bógěng bùwèi huì liúchū xiānhóng xuèyè</em>): Khi chạy nhanh vùng cổ sẽ chảy ra máu đỏ tươi.</li><li><strong>B. 因血管较薄，在快速奔跑时易出血</strong> (<em>Yīn xuèguǎn jiào báo, zài kuàisù bēnpǎo shí yì chūxuè</em>): Do mạch máu mỏng nên khi chạy nhanh dễ chảy máu.</li><li><strong>C. 在快速奔跑时，颈部似有鲜血流出</strong> (<em>Zài kuàisù bēnpǎo shí, jǐngbù sì yǒu xiānhóng liúchū</em>): Khi chạy nhanh, vùng cổ trông như có máu tươi chảy ra (do mồ hôi chảy ra có màu đỏ/tạo ảo giác chảy máu).</li><li><strong>D. 因生活地域特殊而使汗水呈现红色</strong> (<em>Yīn shēnghuó dìyù tèshū ér shǐ hànshuǐ chéngxiàn hóngsè</em>): Do khu vực sống đặc biệt làm cho mồ hôi có màu đỏ.</li></ul>"

        "title": "Câu 38",
        "contentHtml": "<ul><li><em>Dịch câu hỏi:</em> Điều nào sau đây KHÔNG được nhắc đến trong bài nghe?</li><li><strong>A. 寿命长</strong> (<em>Shòumìng cháng</em>): Tuổi thọ cao/sống lâu.</li><li><strong>B. 善奔跑</strong> (<em>Shàn bēnpǎo</em>): Giỏi chạy/chạy nhanh.</li><li><strong>C. 耐高温</strong> (<em>Nài gāowēn</em>): Chịu được nhiệt độ cao.</li><li><strong>D. 耐力强</strong> (<em>Nàilì qiáng</em>): Sức bền mạnh.</li></ul>"

        "title": "Câu 39",
        "contentHtml": "<ul><li><em>Dịch câu hỏi:</em> Lời giải thích về \"thuyết nguyên nhân bệnh\" (病因说) của ngựa Hãn Huyết được nhắc đến trong bài nghe là:</li><li><strong>A. 因寄生虫寄生宝马体内导致的马病所致</strong> (<em>Yīn jìshēngchóng jìshēng bǎomǎ tǐnèi dǎozhì de mǎbìng suǒ zhì</em>): Do bệnh ở ngựa gây ra bởi ký sinh trùng ký sinh trong cơ thể ngựa.</li><li><strong>B. 快速奔跑体温上升使血浆从毛孔中渗出</strong> (<em>Kuàisù bēnpǎo tǐwēn shàngshēng shǐ xuèjiāng cóng máokǒng zhōng shènchū</em>): Chạy nhanh nhiệt độ cơ体 tăng làm huyết tương rỉ ra từ lỗ chân lông.</li><li><strong>C. 宝马汗腺发达，汗液流出后自然呈红色</strong> (<em>Bǎomǎ hànxiàn fādá, hànyè liúchū hòu zìrán chéng hóngsè</em>): Tuyến mồ hôi ngựa phát triển, mồ hôi chảy ra tự nhiên có màu đỏ.</li><li><strong>D. 因皮肤较薄看得见血液流动而造成的错觉</strong> (<em>Yīn pífū jiào báo kàndejiàn xuèyè liúdòng ér zàochéng de cuòjué</em>): Do da mỏng nhìn thấy máu chảy tạo ra ảo giác.</li></ul><hr><h3>4\\. Đáp án đúng &amp;amp; Giải thích</h3><ul><li><strong>Câu 37: Đáp án C</strong></li><li><em>Giải thích ngắn gọn:</em> Bài nghe ghi nhận khi phi nhanh mồ hôi ở cổ chảy ra có chất màu đỏ tươi như máu (<em>脖颈部位流出的汗中有红色物质，鲜红似血</em>), tạo cho người ta ảo giác như đang chảy máu[1].</li><li><strong>Câu 38: Đáp án A</strong></li><li><em>Giải thích ngắn gọn:</em> Bài nghe có nhắc tới tốc độ (<em>善奔跑 / 1000m trong 1分07秒</em>), khả năng chịu nhiệt (<em>耐高温 / 50摄氏度</em>) và sức bền (<em>耐力强 / 一天只需喝一次水</em>), nhưng hoàn toàn không đề cập đến tuổi thọ (<em>寿命长</em>)[1].</li><li><strong>Câu 39: Đáp án A</strong></li><li><em>Giải thích ngắn gọn:</em> Thuyết nguyên nhân bệnh (<em>马病所致</em>) do Đức Hiệu Khiên đưa ra giải thích hiện tượng mồ hôi máu là do một loại ký sinh trùng chui vào da ngựa gây rỉ mủ/bọc nhỏ ở mông và lưng (<em>有一种寄生虫... 钻入马皮内... 出现往外渗的小包</em>)[1].</li></ul><hr><p>🎧 Bạn có muốn tiếp tục phân tích <strong>Câu 40–42 (Bài nghe về vị giáo viên dạy nhạc và bài học vượt qua giới hạn bản thân của người học sinh)</strong> không?</p><p>Làm tiếp câu 40 đến câu 42 nhé</p><p>Dưới đây là chi tiết phân tích <strong>Câu 40 đến Câu 42 (Đề số 1)</strong> thuộc Phần 3 (Chủ đề: <em>Bài học vượt qua giới hạn bản thân của vị giáo sư âm nhạc / 音乐 giáo 授与学生</em>):</p><hr><h3>1\\. Từ vựng trọng tâm</h3><ul><li><strong>乐谱</strong> (<em>yuè pǔ</em>): Bản nhạc, tập nhạc.</li><li><strong>消磨殆尽</strong> (<em>xiāo mó dài jìn</em>): Tiêu hao kiệt cùng, mòn mỏi sạch sẽ.</li><li><strong>谷底</strong> (<em>gǔ dǐ</em>): Đáy vực, mức thấp nhất.</li><li><strong>整人</strong> (<em>zhěng rén</em>): Hành hạ, chơi xỏ / cố tình làm khó người khác.</li><li><strong>声色僵硬</strong> (<em>shēng sè jiāng yìng</em>): Âm thanh và thần thái cứng đờ, gượng gạo.</li><li><strong>游刃有余</strong> (<em>yóu rèn yǒu yú</em>): Thành thạo, thong dong giải quyết dễ dàng.</li><li><strong>沮丧</strong> (<em>jǔ sàng</em>): Nản lòng, chán nản.</li><li><strong>精湛</strong> (<em>jīng zhàn</em>): Điêu luyện, tinh xảo, điêu luyện bậc thầy.</li><li><strong>怔怔</strong> (<em>zhèng zhèng</em>): Ngẩn ngơ, thẫn thờ.</li></ul><hr><h3>2\\. Đoạn văn gốc (Bài nghe Câu 40–42)</h3><ul><li><strong>Tiếng Trung nguyên văn:</strong> 一位音乐系的学生走进练习室，在钢琴上摆着一份全新的乐谱，超高难度。</li><li><strong>Pinyin:</strong> Yī wèi yīnyuè xì de xuésheng zǒu jìn liànxí shì, zài gāngqín shàng bǎi zhe yī fèn quánxīn de yuèpǔ, chāo gāo nándù.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Một sinh viên khoa âm nhạc bước vào phòng luyện tập, trên cây đàn piano đặt một bản nhạc hoàn toàn mới với độ khó cực cao.</li><li><strong>Tiếng Trung nguyên văn:</strong> 他翻着乐谱喃喃自语，感觉自己对弹奏钢琴的信心似乎已到谷底，消磨殆尽。</li><li><strong>Pinyin:</strong> Tā fān zhe yuèpǔ nánnán-zìyǔ, gǎnjué zìjǐ duì tánzòu gāngqín de xìnxīn sìhū yǐ dào gǔdǐ, xiāomó-dàijìn.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Cậu lật xem bản nhạc rồi lẩm bẩm một mình, cảm thấy niềm tin chơi piano của mình dường như đã chạm đáy, tiêu tan sạch sẽ.</li><li><strong>Tiếng Trung nguyên văn:</strong> 已经三个月了，自从跟了这位新的指导教授之后，不知道为什么教授要以这种方式整人。</li><li><strong>Pinyin:</strong> Yǐjīng sān gè yuè le, zìcóng gēn le zhè wèi xīn de zhǐdǎo jiàoshòu zhīhòu, bù zhīdào wèi shénme jiàoshòu yào yǐ zhè zhǒng fāngshì zhěngrén.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Đã ba tháng rồi, kể từ khi theo vị giáo sư hướng dẫn mới này, không biết tại sao giáo sư lại muốn dùng cách này để hành hạ mình.</li><li><strong>Tiếng Trung nguyên văn:</strong> 勉强打起精神，他开始用自己的手指奋战、奋战、奋战，琴声盖住了教室外面教授来的脚步声。</li><li><strong>Pinyin:</strong> Miǎnqiǎng dǎ qǐ jīngshén, tā kāishǐ yòng zìjǐ de shǒuzhǐ fènzhàn, fènzhàn, fènzhàn, qínshēng gài zhù le jiàoshì wàimian jiàoshòu lái de jiǎobù shēng.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Cượng ép xốc lại tinh thần, cậu bắt đầu dùng các ngón tay của mình chiến đấu, chiến đấu, chiến đấu, tiếng đàn che lấp cả tiếng bước chân của giáo sư đang đi tới bên ngoài phòng học.</li><li><strong>Tiếng Trung nguyên văn:</strong> 指导教授是个极其有名的音乐大师，授课的第一天，他给自己的新学生一份乐谱，“试试看吧，”他说。</li><li><strong>Pinyin:</strong> Zhǐdǎo jiàoshòu shì gè jíqí yǒumíng de yīnyuè dàshī, shòukè de dì-yī tiān, tā gěi zìjǐ de xīn xuésheng yī fèn yuèpǔ, \"Shì shì kàn ba,\" tā shuō.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Giáo sư hướng dẫn là một đại sư âm nhạc cực kỳ nổi tiếng, ngày đầu tiên lên lớp, ông đưa cho người học trò mới của mình một bản nhạc và nói: \"Chơi thử xem sao.\"</li><li><strong>Tiếng Trung nguyên văn:</strong> 乐谱的难度颇高，学生弹得声色僵硬，错误百出，“还不成熟，回去好好练习，”教授下课时如此叮嘱学生。</li><li><strong>Pinyin:</strong> Yuèpǔ de nándù pō gāo, xuésheng tán de shēngsè jiāngyìng, cuòwù bǎi chū, \"Hái bù chéngshú, huíqù hǎohǎo liànxí,\" jiàoshòu xiàkè shí rúcǐ dīngzhǔ xuésheng.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Bản nhạc có độ khó khá cao, sinh viên đánh đàn âm thanh gượng gạo, lỗi sai chật vật, \"Vẫn chưa thuần thục, về nhà chăm chỉ luyện tập,\" giáo sư dặn dò cậu như vậy khi tan lớp.</li><li><strong>Tiếng Trung nguyên văn:</strong> 学生练习了一个星期，第二周上课时，正准备让教授验收，没想到教授又给他一份难度更高的乐谱，“试试看吧，”而上期的乐谱教授却根本没提。</li><li><strong>Pinyin:</strong> Xuésheng liànxí le yī gè xīngqī, dì-èr zhōu shàngkè shí, zhèng zhǔnbèi ràng jiàoshòu yànshōu, méi xiǎngdào jiàoshòu yòu gěi tā yī fèn nándù gèng gāo de yuèpǔ, \"Shì shì kàn ba,\" ér shàngqī de yuèpǔ jiàoshòu què gēnběn méi tí.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Sinh viên luyện tập một tuần, tuần thứ hai khi lên lớp đang chuẩn bị để giáo sư kiểm tra thì không ngờ giáo sư lại đưa cho cậu một bản nhạc có độ khó cao hơn: \"Chơi thử xem sao,\" còn bản nhạc tuần trước giáo sư tuyệt nhiên không nhắc tới.</li><li><strong>Tiếng Trung nguyên văn:</strong> 学生再次挣扎于更高难度的技巧挑战。第三周，更难的乐谱又出现了。</li><li><strong>Pinyin:</strong> Xuésheng zàicì zhèngzhá yú gèng gāo nándù de jìqiǎo tiǎozhàn. Dì-sān zhōu, gèng nán de yuèpǔ yòu chūxiàn le.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Sinh viên lại một lần nữa vật lộn với thử thách kỹ thuật có độ khó cao hơn. Tuần thứ ba, bản nhạc khó hơn lại xuất hiện.</li><li><strong>Tiếng Trung nguyên văn:</strong> 同样的情形一直持续着，学生每次在课堂上都被一份新的乐谱所困扰，然后把它带回去练习，接着再回到课堂上重新面对两倍难度的乐谱。</li><li><strong>Pinyin:</strong> Tóngyàng de qíngxíng yīzhí chíxù zhe, xuésheng měicì zài kètáng shàng dōu bèi yī fèn xīn de yuèpǔ suǒ kùnrǎo, ránhòu bǎ tā dài huíqù liànxí, jiēzhe zài huí dào kètáng shàng chóngxīn miànduì liǎng bèi nándù de yuèpǔ.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Tình trạng tương tự cứ thế tiếp diễn, lần nào ở trên lớp sinh viên cũng bị một bản nhạc mới làm cho bối rối, sau đó mang về nhà luyện tập, rồi lại trở lại phòng học đối mặt với bản nhạc khó gấp đôi.</li><li><strong>Tiếng Trung nguyên văn:</strong> 但学生觉得自己怎么都追不上进度，一点也没有因为上周的练习而有游刃有余的感觉。学生感到越来越不安、沮丧和气愤。</li><li><strong>Pinyin:</strong> Dàn xuésheng juéde zìjǐ zěnme dōu zhuī bù shàng jìndù, yīdiǎn yě méiyǒu yīnwèi shàng zhōu de liànxí ér yǒu yóurèn-yǒuyú de gǎnjué. Xuésheng gǎndào yuè lái yuè bù'ān, jǔsàng hé qìfèn.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Nhưng sinh viên cảm thấy mình làm sao cũng không theo kịp tiến độ, không hề có cảm giác thong dong thạo tay nhờ vào sự luyện tập của tuần trước. Sinh viên cảm thấy ngày càng bất an, nản lòng và tức giận.</li><li><strong>Tiếng Trung nguyên văn:</strong> 这一天，教授走进练习室，学生再也忍不住了，他必须问教授这三个月来为何不断的折磨自己。</li><li><strong>Pinyin:</strong> Zhè yī tiān, jiàoshòu zǒu jìn liànxí shì, xuésheng zài yě rěn bù zhù le, tā bìxū wèn jiàoshòu zhè sān gè yuè lái wèihé bùduàn de zhěmó zìjǐ.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Ngày hôm đó, giáo sư bước vào phòng luyện tập, sinh viên không thể chịu đựng thêm được nữa, cậu nhất định phải hỏi giáo sư tại sao ba tháng qua lại liên tục hành hạ mình như vậy.</li><li><strong>Tiếng Trung nguyên văn:</strong> 教授没开口，他抽出最早的那份谱交给学生，“弹弹看吧，”他以坚定的目光望着学生。</li><li><strong>Pinyin:</strong> Jiàoshòu méi kāikǒu, tā chōuchū zuì zǎo de nà fèn pǔ jiāo gěi xuésheng, \"Tán tán kàn ba,\" tā yǐ jiāndìng de mùguāng wàng zhe xuésheng.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Giáo sư không nói gì, ông rút ra bản nhạc đầu tiên giao cho sinh viên: \"Đánh thử xem,\" ông nhìn sinh viên bằng ánh mắt kiên định.</li><li><strong>Tiếng Trung nguyên văn:</strong> 不可思议的事情发生了，连学生自己都惊讶万分，他居然可以将这首曲子弹奏得如此美妙、如此精湛！</li><li><strong>Pinyin:</strong> Bùkěsīyì de shìqing fāshēng le, lián xuésheng zìjǐ dōu jīngyà wànfēn, tā jūrán kěyǐ jiāng zhè shǒu qǔzi tánzòu de rúcǐ měimiào, rúcǐ jīngzhàn!</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Điều không thể tin nổi đã xảy ra, đến chính sinh viên cũng vô cùng kinh ngạc, cậu lại có thể thể hiện bản nhạc này một cách tuyệt diệu và điêu luyện đến thế!</li><li><strong>Tiếng Trung nguyên văn:</strong> 教授又让学生弹了第二堂课的乐谱，学生依然呈现出超高水准的表现。演奏结束后，学生怔怔地望着老师，说不出话来。</li><li><strong>Pinyin:</strong> Jiàoshòu yòu ràng xuésheng tán le dì-èr táng kè de yuèpǔ, xuésheng yīrán chéngxiàn chū chāo gāo shuǐzhǔn de biǎoxiàn. Yǎnzòu jiéshù hòu, xuésheng zhèngzhèng de wàng zhe lǎoshī, shuō bù chū huà lái.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Giáo sư lại bảo sinh viên đánh bản nhạc của buổi học thứ hai, sinh viên vẫn thể hiện phong độ đẳng cấp vượt trội. Sau khi phần biểu diễn kết thúc, sinh viên thẫn thờ nhìn thầy, không nói nên lời.</li><li><strong>Tiếng Trung nguyên văn:</strong> “如果你任由你表现最擅长的部分，可能你还在练习最早的那份谱，那么你就不会有现在这样的程度了。”教授缓缓地说。</li><li><strong>Pinyin:</strong> \"Rúguǒ nǐ rènyóu nǐ biǎoxiàn zuì shàncháng de bùfen, kěnéng nǐ hái zài liànxí zuì zǎo de nà fèn pǔ, nàme nǐ jiù bú huì yǒu xiànzài zhèyàng de chéngdù le.\" Jiàoshòu huǎnhuǎn de shuō.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> \"Nếu thầy để trò tự do chỉ thể hiện phần mình giỏi nhất, có lẽ giờ trò vẫn đang luyện tập bản nhạc đầu tiên đó, và trò sẽ không thể có được trình độ như ngày hôm nay.\" Giáo sư từ tốn nói.</li></ul><hr><h3>3\\. Phương án lựa chọn A–D</h3>"

        "title": "Câu 40",
        "contentHtml": "<ul><li><em>Dịch câu hỏi:</em> Sinh viên đánh giá/nhìn nhận như thế nào về các bản nhạc độ khó cực cao của giáo sư?</li><li><strong>A. 是一种鼓励</strong> (<em>Shì yī zhǒng gǔlì</em>): Là một sự khuyến khích.</li><li><strong>B. 是一种折磨</strong> (<em>Shì yī zhǒng zhémó</em>): Là một sự hành hạ/tra tấn.</li><li><strong>C. 是一种刁难</strong> (<em>Shì yī zhǒng diāonán</em>): Là một sự cố tình làm khó/gây khó dễ.</li><li><strong>D. 是一种考验</strong> (<em>Shì yī zhǒng kǎoyàn</em>): Là một sự thử thách.</li></ul>"

        "number": 41,
        "title": "Câu 41",
        "contentHtml": "<ul><li><em>Dịch câu hỏi:</em> Sau khi sinh viên luyện tập bản nhạc mới được một tuần, giáo sư đã làm gì?</li><li><strong>A. 布置更高难度的乐谱</strong> (<em>Bùzhì gèng gāo nándù de yuèpǔ</em>): Giao bản nhạc có độ khó cao hơn.</li><li><strong>B. 指出并改正学生演奏</strong> (<em>Zhǐchū bìng gǎizhèng xuésheng yǎnzòu</em>): Chỉ ra và sửa đổi phần biểu diễn của sinh viên.</li><li><strong>C. 鼓励并给予学生指导</strong> (<em>Gǔlì bìng jǐyǔ xuésheng zhǐdǎo</em>): Khuyến khích và hướng dẫn sinh viên.</li><li><strong>D. 检查学生的练习效果</strong> (<em>Jiǎnchá xuésheng de liànxí xiàoguǒ</em>): Kiểm tra kết quả luyện tập của sinh viên.</li></ul>"
      },
      {
        "number": 42,
        "title": "Câu 42",
        "contentHtml": "<ul><li><em>Dịch câu hỏi:</em> Từ câu chuyện này chúng ta có thể rút ra điều gì?</li><li><strong>A. 应该学会扬长避短</strong> (<em>Yīnggāi xuéhuì yángcháng-bìduǎn</em>): Nên học cách phát huy điểm mạnh, tránh điểm yếu.</li><li><strong>B. 大师也未必就可信</strong> (<em>Dàshī yě wèi bì jiù kě xìn</em>): Đại sư chưa chắc đã đáng tin.</li><li><strong>C. 压力未必就是坏事</strong> (<em>Yālì wèi bì jiù shì huàishì</em>): Áp lực chưa chắc đã là chuyện xấu.</li><li><strong>D. 别做力所不及的事</strong> (<em>Bié zuò lìsuǒbùjí de shì</em>): Đừng làm việc ngoài tầm khả năng.</li></ul><hr><h3>4\\. Đáp án đúng &amp;amp; Giải thích</h3><ul><li><strong>Câu 40: Đáp án B</strong></li><li><em>Giải thích ngắn gọn:</em> Trong bài nghe, người sinh viên tự thắc mắc không hiểu sao giáo sư lại dùng cách này để làm khó mình (<em>整人</em>) và Uất ức nghĩ rằng suốt 3 tháng qua ông liên tục \"hành hạ mình\" (<em>为何不断的折磨自己</em>).</li><li><strong>Câu 41: Đáp án A</strong></li><li><em>Giải thích ngắn gọn:</em> Bài nghe nêu rõ sau 1 tuần luyện tập, khi sinh viên định cho giáo sư kiểm tra thì \"giáo sư lại đưa cho cậu một bản nhạc có độ khó cao hơn\" (<em>教授又给他一份难度更高的乐谱</em>), hoàn toàn không nhắc tới bài tuần trước.</li><li><strong>Câu 42: Đáp án C</strong></li><li><em>Giải thích ngắn gọn:</em> Áp lực liên tục ép sinh viên vượt qua giới hạn của bản thân đã giúp cậu đạt tới trình độ kinh ngạc mà bình thường không tưởng tượng nổi. Điều này chứng minh áp lực không phải lúc nào cũng là điều tồi tệ (<em>压力未必就是坏事</em>).</li></ul><hr><p>🎹 Bạn có muốn tiếp tục phân tích <strong>Câu 43–46 (Bài nghe về nguồn gốc và ý nghĩa thiên văn của phong tục \"Rồng ngẩng đầu\" ngày 2 tháng 2 âm lịch / 二月二龙抬头)</strong> không?</p><p>Làm tiếp câu 43 đến câu 46 nhé</p><p>Dưới đây là chi tiết phân tích <strong>Câu 43 đến Câu 46 (Đề số 1)</strong> thuộc Phần 3 (Chủ đề: <em>Nguồn gốc và ý nghĩa thiên văn của tục \"Rồng ngẩng đầu\" ngày Mùng 2 tháng 2 âm lịch / 二月二龙抬头</em>):</p><hr><h3>1\\. Từ vựng trọng tâm</h3><ul><li><strong>龙抬头</strong> (<em>lóng tái tóu</em>): Rồng ngẩng đầu (lễ hội dân gian mùng 2 tháng 2 âm lịch).</li><li><strong>复苏</strong> (<em>fù sū</em>): Hồi phục, thức tỉnh, phục hồi sức sống.</li><li><strong>仲春</strong> (<em>zhòng chūn</em>): Giữa mùa xuân (tháng 2 âm lịch).</li><li><strong>惊蛰</strong> (<em>jīng zhé</em>): Kinh Trập (sâu bọ thức giấc — 1 trong 24 tiết khí).</li><li><strong>蛰伏</strong> (<em>zhé fú</em>): Trú đông, ẩn nấp (động vật).</li><li><strong>黄道</strong> (<em>huáng dào</em>): Hoàng đạo (đường đi của Mặt Trời nhìn từ Trái Đất).</li><li><strong>二十八宿</strong> (<em>èr shí bā xiù</em>): Nhị thập bát tú (28 chòm sao cổ đại).</li><li><strong>角宿</strong> (<em>jiǎo xiù</em>): Sao Giác (chòm sao mở đầu của nhóm Đông Phương Thương Long, tượng trưng cho sừng rồng).</li></ul><hr><h3>2\\. Đoạn văn gốc (Bài nghe Câu 43–46)</h3><ul><li><strong>Tiếng Trung nguyên văn:</strong> 农历二月初二，民间称为龙抬头，也称春龙节，南方又叫踏青节，古称挑菜节。这一天象征着春回大地，万物复苏。大约从唐朝开始，中国人就有过二月二的习俗。</li><li><strong>Pinyin:</strong> Nónglì èr yuè chū èr, mínjiān chēng wéi Lóngtái tóu, yě chēng Chūnlóngjié, nánfāng yòu jiào Tàqīngjié, gǔ chēng Tiāocàijié. Zhè yī tiān xiàngzhēng zhe chūn huí dàdì, wànwù fùsū. Dàyuē cóng Tángcháo kāishǐ, Zhōngguórén jiù yǒu guò Èr yuè èr de xísú.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Mùng 2 tháng 2 âm lịch, dân gian gọi là lễ \"Rồng ngẩng đầu\", còn gọi là Tết Xuân Long, miền Nam gọi là Tết Đạp Thanh, thời cổ gọi là Tết Khiêu Thái. Ngày này tượng trưng cho xuân trở lại mặt đất, muôn vật hồi sinh. Khoảng từ thời nhà Đường, người Trung Quốc đã có tập tục đón mùng 2 tháng 2.</li><li><strong>Tiếng Trung nguyên văn:</strong> 据资料记载，这句话的来历与古代天文学对星辰运行的认识和农业节气有关。</li><li><strong>Pinyin:</strong> Jù zīliào jìzǎi, zhè jù huà de láilì yǔ gǔdài tiānwénxué duì xīngchén yùnxíng de rènshi hé nóngyè jiéqì yǒuguān.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Theo ghi chép, nguồn gốc của câu nói này có liên quan đến nhận thức của thiên văn học cổ đại về sự vận hành của các vì sao và tiết khí nông nghiệp.</li><li><strong>Tiếng Trung nguyên văn:</strong> 为什么要在二月二说龙抬头呢？因为农历二月已进入仲春季节，这时阳气上升，大地复苏，草木萌动，农民们就要春耕播种了，非常需要土壤湿润，保有水分。</li><li><strong>Pinyin:</strong> Wèi shénme yào zài Èr yuè èr shuō lóng tái tóu ne? Yīnwèi nónglì èr yuè yǐ jìnrù zhòngchūn jìjié, zhè shí yángqì shàngshēng, dàdì fùsū, cǎomù méngdòng, nóngmínmen jiù yào chūngēng bōzhǒng le, fēicháng xūyào tǔrǎng shīrùn, bǎoyǒu shuǐfèn.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Tại sao lại nói \"rồng ngẩng đầu\" vào mùng 2 tháng 2? Vì tháng 2 âm lịch đã bước vào giữa mùa xuân, lúc này dương khí bốc lên, mặt đất hồi sinh, cỏ cây cựa mình, nông dân bắt đầu cày cấy gieo hạt, rất cần đất đai ẩm ướt, giữ được độ ẩm.</li><li><strong>Tiếng Trung nguyên văn:</strong> 从节气上说，二月初正处在雨水、惊蛰、春分之间，这是个既需要雨水，又可能有降雨的时机，人们非常希望通过对龙的祈求行为来实现降雨的目的。</li><li><strong>Pinyin:</strong> Cóng jiéqì shàng shuō, èr yuè chū zhèng chǔ zài Yǔshuǐ, Jīngzhé, Chūnfēn zhījiān, zhè shì gè jì xūyào yǔshuǐ, yòu kěnéng yǒu jiàngyǔ de shíjī, rénmen fēicháng xīwàng tōngguò duì lóng de qíqiú xíngwéi lái shíxiàn jiàngyǔ de mùdì.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Xét về tiết khí, đầu tháng 2 nằm đúng vào khoảng giữa Vũ Thủy, Kinh Trập và Xuân Phân, đây là thời điểm vừa cần mưa vừa có khả năng giáng mưa, mọi người rất hy vọng thông qua hành vi cầu khấn rồng để đạt được mục đích mưa xuống.</li><li><strong>Tiếng Trung nguyên văn:</strong> 为什么是龙抬头呢？因为二月初处于惊蛰前后，蛰伏一冬的各种动物又恢复了活力，该有所活动了。龙抬头了，意味着龙也行动起来要履行他降雨的职责了。不过这种说法是一般人对二月二龙抬头的解释，通俗易懂。</li><li><strong>Pinyin:</strong> Wèi shénme shì lóng tái tóu ne? Yīnwèi èr yuè chū chǔyú Jīngzhé qiánhòu, zhéfú yī dōng de gè zhǒng dòngwù yòu huīfù le huólì, gāi yǒu suǒ huódòng le. Lóng tái tóu le, yìwèi zhe lóng yě xíngdòng qǐlái yào lǚxíng tā jiàngyǔ de zhízé le. Búguò zhè zhǒng shuōfǎ shì yībānrén duì Èr yuè èr lóng tái tóu de jiěshì, tōngsú-yìdǒng.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Tại sao lại là \"rồng ngẩng đầu\"? Vì đầu tháng 2 nằm vào khoảng tiết Kinh Trập, các loài động vật trú đông suốt mùa đông lại phục hồi sức sống, đã đến lúc hoạt động. Rồng ngẩng đầu có nghĩa là rồng cũng bắt đầu hành động để thực hiện trách nhiệm làm mưa của mình. Tuy nhiên cách nói này là lời giải thích thông thường của đại chúng về \"rồng ngẩng đầu\", thông俗 dễ hiểu.</li><li><strong>Tiếng Trung nguyên văn:</strong> 对于龙抬头还有古代天文学方面的解释。古人以为地球是不动的，是太阳在运动。早在春秋时期，甚至更早，人们就把太阳在恒星之间的周年运动轨迹视为一个圆，称为黄道。再利用某些恒星把这个圆分为28个等份，形成28个区间，称为28宿。</li><li><strong>Pinyin:</strong> Duìyú lóng tái tóu hái yǒu gǔdài tiānwénxué fāngmiàn de jiěshì. Gǔrén yǐwéi dìqiú shì bù dòng de, shì tàiyáng zài yùndòng. Zǎo zài Chūnqiū shíqī, shènzhì gèng zǎo, rénmen jiù bǎ tàiyáng zài héngxīng zhījiān de zhōunián yùndòng guǐjì shìwéi yī gè yuán, chēng wéi huángdào. Zài lìyòng mǒu xiē héngxīng bǎ zhè gè yuán fēn wéi 28 gè děngfèn, xíngchéng 28 gè qūjiān, chēng wéi 28 xiù.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Đối với \"rồng ngẩng đầu\" còn có lời giải thích trên phương diện thiên văn học cổ đại. Người xưa cho rằng Trái Đất đứng yên, Mặt Trời vận động. Ngay từ thời Xuân Thu, thậm chí sớm hơn, người ta đã coi quỹ đạo vận động hàng năm của Mặt Trời giữa các hằng tinh là một hình tròn, gọi là Hoàng đạo. Sau đó lợi dụng một số hằng tinh chia hình tròn này thành 28 phần bằng nhau, tạo thành 28 khoảng, gọi là Nhị thập bát tú.</li><li><strong>Tiếng Trung nguyên văn:</strong> 把这28宿按照东南西北四个方位平分，每个方位便有七个宿。在东方的七个宿分别叫做角、亢、氐、房、心、尾、箕，他们构成一组称为东方苍龙。其中角宿象征龙的头角。</li><li><strong>Pinyin:</strong> Bǎ zhè 28 xiù ànzhào dōng-nán-xī-běi sì gè fāngwèi píngfēn, měi gè fāngwèi biàn yǒu qī gè xiù. Zài dōngfāng de qī gè xiù fēnbié jiào zuò Jiǎo, Kàng, Dǐ, Fáng, Xīn, Wěi, Jī, tāmen gòuchéng yī zǔ chēng wéi Dōngfāng Cānglóng. Qízhōng Jiǎoxiù xiàngzhēng lóng de tóujiǎo.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Chia 28 chòm sao này đều ra bốn phương Đông Tây Nam Bắc, mỗi phương có 7 chòm sao. 7 chòm sao ở phương Đông lần lượt gọi là Giác, Kháng, Đê, Phòng, Tâm, Vĩ, Cơ, chúng hợp thành một nhóm gọi là Đông Phương Thương Long. Trong đó sao Giác tượng trưng cho sừng rồng.</li><li><strong>Tiếng Trung nguyên văn:</strong> 在冬季，这苍龙七宿都隐没在地平线下，黄昏以后看不见他们。至二月初黄昏来临时，角宿就从东方地平线上出现了。这时整个苍龙的身子还隐没在地平线以下，只是角宿初露，故称龙抬头。</li><li><strong>Pinyin:</strong> Zài dōngjì, zhè Cānglóng qī xiù dōu yǐnmò zài dìpíngxiàn xià, huánghūn yǐhòu kàn bú jiàn tāmen. Zhì èr yuè chū huánghūn lái lín shí, Jiǎoxiù jiù cóng dōngfāng dìpíngxiàn shàng chūxiàn le. Zhè shí zhěnggè Cānglóng de shēnzi hái yǐnmò zài dìpíngxiàn yǐxià, zhǐshì Jiǎoxiù chū lù, gù chēng lóng tái tóu.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Vào mùa đông, 7 chòm sao Thương Long này đều ẩn bên dưới đường chân trời, sau hoàng hôn không nhìn thấy chúng. Đến đầu tháng 2 khi hoàng hôn buông xuống, sao Giác xuất hiện trên đường chân trời phía Đông. Lúc này toàn bộ thân mình rồng vẫn ẩn dưới đường chân trời, chỉ có sao Giác mới nhô ra, nên gọi là \"Rồng ngẩng đầu\".</li></ul><hr><h3>3\\. Phương án lựa chọn A–D</h3>"
      },

        "contentHtml": "<ul><li><em>Dịch câu hỏi:</em> Trong đoạn văn nói \"Mùng 2 tháng 2 Rồng ngẩng đầu\" có liên quan đến điều gì?</li><li><strong>A. 农民愿望</strong> (<em>Nóngmín yuànwàng</em>): Nguyện vọng của nông dân.</li><li><strong>B. 星辰运行</strong> (<em>Xīngchén yùnxíng</em>): Sự vận hành của các vì sao.</li><li><strong>C. 季节变化</strong> (<em>Jìjié biànhuà</em>): Sự thay đổi mùa.</li><li><strong>D. 农业收成</strong> (<em>Nóngyè shōucheng</em>): Thu hoạch nông nghiệp.</li></ul>"

        "number": 46,
        "title": "Câu 46",
        "contentHtml": "<ul><li><em>Dịch câu hỏi:</em> Điều nào sau đây KHÔNG phù hợp với ý đoạn văn?</li><li><strong>A. 古人认为地球是不动的，太阳是运动的</strong> (<em>Gǔrén yǐwéi dìqiú shì bù dòng de, tàiyáng shì yùndòng de</em>): Người xưa cho rằng Trái Đất đứng yên, Mặt Trời vận động.</li><li><strong>B. 古人将黄道分为28个区间，称为“二十八宿”</strong> (<em>Gǔrén jiāng huángdào fēn wéi 28 gè qūjiān, chēng wéi \"Èrshíbā xiù\"</em>): Người xưa chia Hoàng đạo thành 28 khoảng, gọi là \"Nhị thập bát tú\".</li><li><strong>C. 从唐朝开始，民间就有过“二月二”的习俗</strong> (<em>Cóng Tángcháo kāishǐ, mínjiān jiù yǒu guò \"Èr yuè èr\" de xísú</em>): Từ thời nhà Đường, dân gian đã có tập tục đón \"Mùng 2 tháng 2\".</li><li><strong>D. 古人根据太阳的运行规律将“宿”分为28区</strong> (<em>Gǔrén gēnjù tàiyáng de yùnxíng guīlǜ jiāng \"xiù\" fēn wéi 28 qū</em>): Người xưa dựa vào quy luật vận động của Mặt Trời để chia \"tú\" thành 28 khu vực.</li></ul><hr><h3>4\\. Đáp án đúng &amp;amp; Giải thích</h3><ul><li><strong>Câu 43: Đáp án B</strong>[1][2]</li><li><em>Giải thích ngắn gọn:</em> Bài nghe nêu rõ nguồn gốc câu nói này có liên quan đến nhận thức thiên văn về sự vận hành của các vì sao (<em>与古代天文学对星辰运行的认识...有关</em>)[2].</li><li><strong>Câu 44: Đáp án C</strong>[1][2]</li><li><em>Giải thích ngắn gọn:</em> Bài nghe giải thích lý do gọi là \"rồng ngẩng đầu\" là do mùng 2 tháng 2 nằm vào khoảng trước sau tiết Kinh Trập (<em>因为二月初处于惊蛰前后</em>)[2].</li><li><strong>Câu 45: Đáp án C</strong>[1][2]</li><li><em>Giải thích ngắn gọn:</em> Dưới góc nhìn thiên văn, hiện tượng này xảy ra khi hoàng hôn đầu tháng 2, sao Giác (tượng trưng sừng rồng) nhô ra xuất hiện trên đường chân trời phía Đông (<em>二月初... 只是角宿初露，故称龙抬头</em>)[2].</li><li><strong>Câu 46: Đáp án D</strong>[1][2]</li><li><em>Giải thích ngắn gọn:</em> \"Tú\" (宿) mang nghĩa cư trú, gắn liền với chu kỳ di chuyển hàng ngày của Mặt Trăng (<em>如果观察月亮的运行，他基本上是每天入住一宿</em>)[2], không phải phân chia dựa trên quy luật vận động của Mặt Trời. Do đó D là nhận định sai so với nội dung bài đọc.</li></ul><hr><p>🥣 Bạn có muốn tiếp tục giải <strong>4 câu cuối cùng (Câu 47–50 - Bài nghe về tầm quan trọng của bữa ăn sáng đối với sức khỏe &amp;amp; nồng độ đường huyết)</strong> để hoàn thành trọn vẹn Đề số 1 không?</p><p>Làm tiếp câu 47 đến câu 50 nhé</p><p>Dưới đây là chi tiết phân tích <strong>4 câu cuối cùng (Câu 47 đến Câu 50)</strong> để hoàn thành trọn vẹn <strong>Đề số 1</strong> thuộc Phần 3 (Chủ đề: <em>Tầm quan trọng của bữa ăn sáng đối với sức khỏe và nồng độ đường huyết</em>)[1]:</p><hr>"
      },
      {
        "number": 47,
        "title": "Câu 47",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>血糖</strong> (<em>xuè táng</em>): Đường huyết[1].</li><li><strong>倦怠</strong> (<em>juàn dài</em>): Mệt mỏi, uể oải[1].</li><li><strong>反应迟钝</strong> (<em>fǎn yìng chí dùn</em>): Phản ứng chậm chạp[1].</li><li><strong>肇事者</strong> (<em>zhào shì zhě</em>): Người gây tai nạn[1].</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 营养学家的相关调查表明，许多车祸的发生都与肇事者血糖水平过低、反应迟钝有关。因此营养学家警告开车族们，血糖过低时开车与酒后驾车同样危险。[1]</li><li><strong>Pinyin:</strong> Yíngyǎngxuéjiā de xiāngguān diàochá biǎomíng, xǔduō chēhuò de fāshēng dōu yǔ zhàoshìzhě xuètáng shuǐpíng guò dī, fǎnyìng chídùn yǒuguān. Yīncǐ yíngyǎngxuéjiā jǐnggào kāichēzúmen, xuètáng guò dī shí kāichē yǔ jiǔhòu jiàchē tóngyàng wēixiǎn.[1]</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Điều tra liên quan của các nhà dinh dưỡng học chỉ ra rằng, nhiều tai nạn giao thông xảy ra có liên quan đến việc người gây tai nạn có nồng độ đường huyết quá thấp và phản ứng chậm chạp. Vì vậy các nhà dinh dưỡng học cảnh báo người lái xe rằng, lái xe khi đường huyết quá thấp cũng nguy hiểm tương tự như lái xe sau khi uống rượu.[1]</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 酒后驾车</strong> (<em>Jiǔhòu jiàchē</em>): Lái xe sau khi uống rượu[4].</li><li><strong>B. 疲劳驾驶</strong> (<em>Píláo jiàshǐ</em>): Lái xe khi mệt mỏi[4].</li><li><strong>C. 血糖过低</strong> (<em>Xuètáng guò dī</em>): Nồng độ đường huyết quá thấp[4].</li><li><strong>D. 性格暴躁</strong> (<em>Xìnggé bàozào</em>): Tính tình nóng nảy, cộc cần[4].</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>C</strong>[4]</li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe chỉ ra trực tiếp rằng nhiều vụ tai nạn giao thông xảy ra có liên quan tới việc người gây tai nạn có nồng độ đường huyết quá thấp[1].</li></ul><hr>"
      },
      {
        "number": 48,
        "title": "Câu 48",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>凑合</strong> (<em>còu he</em>): Tạm bợ, qua loa[2].</li><li><strong>脂肪氧化</strong> (<em>zhī fáng yǎng huà</em>): Sự oxy hóa chất béo[2].</li><li><strong>囤积</strong> (<em>tún jī</em>): Tích tụ, dồn lại[2].</li><li><strong>发胖</strong> (<em>fā pàng</em>): Béo lên, tăng cân[2].</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 这两种人一天摄入的热量虽然相同，但脂肪氧化的情况却不同。早餐吃高热量食品的人，再配合低热量的午餐晚餐，脂肪不容易囤积。[2]</li><li><strong>Pinyin:</strong> Zhè liǎng zhǒng rén yī tiān shèrù de rèliàng suīrán xiāngtóng, dàn zhīfáng yǎnghuà de qíngkuàng què bùtóng. Zǎocān chī gāo rèliàng shípǐn de rén, zài pèihé dī rèliàng de wǔcān wǎncān, zhīfáng bù róngyì túnjī.[2]</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Hai nhóm người này tuy lượng calo nạp vào trong một ngày là như nhau, nhưng tình trạng oxy hóa chất béo lại khác nhau. Người ăn bữa sáng có lượng calo cao, kết hợp với bữa trưa và bữa tối có lượng calo thấp thì chất béo không dễ tích tụ.[2]</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 脂肪氧化程度不同</strong> (<em>Zhīfáng yǎnghuà chéngdù bùtóng</em>): Mức độ oxy hóa chất béo khác nhau[4].</li><li><strong>B. 所摄入的热量不同</strong> (<em>Suǒ shèrù de rèliàng bùtóng</em>): Lượng calo nạp vào khác nhau[4].</li><li><strong>C. 所摄入的糖分不同</strong> (<em>Suǒ shèrù de tángfèn bùtóng</em>): Lượng đường nạp vào khác nhau[4].</li><li><strong>D. 营养素摄入量不同</strong> (<em>Yíngyǎngxù shèrùliàng bùtóng</em>): Lượng dưỡng chất nạp vào khác nhau[4].</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>A</strong>[4]</li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe giải thích lý do việc phân bổ calo giữa các bữa ăn khác nhau dẫn đến hình thể khác nhau là do \"tình trạng/mức độ oxy hóa chất béo khác nhau\"[2].</li></ul><hr>"
      },
      {
        "number": 49,
        "title": "Câu 49",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>衰老</strong> (<em>shuāi lǎo</em>): Lão hóa[2].</li><li><strong>胃黏膜</strong> (<em>wèi zhān mó</em>): Niêm mạc dạ dày[1][2].</li><li><strong>胃溃疡</strong> (<em>wèi kuì yáng</em>): Loét dạ dày[2].</li><li><strong>精力充沛</strong> (<em>jīng lì chōng pèi</em>): Tinh lực dồi dào, tràn đầy năng lượng[2].</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 早餐吃高热量食品的人，再配合低热量的午餐晚餐，脂肪不容易囤积；而早餐不吃或吃的太简单的人…… 结果是吃进去的热量比消耗的热量多，当然容易发胖。[2]</li><li><strong>Pinyin:</strong> Zǎocān chī gāo rèliàng shípǐn de rén, zài pèihé dī rèliàng de wǔcān wǎncān, zhīfáng bù róngyì túnjī; ér zǎocān bù chī huò chī de tài jiǎndān de rén... Jiéguǒ shì chī jìnqù de rèliàng bǐ xiāohào de rèliàng duō, dāngrán róngyì fāpàng.[2]</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Người ăn bữa sáng chất lượng phối hợp với bữa trưa tối calo thấp thì chất béo không dễ tích tụ; còn người không ăn sáng hoặc ăn quá đơn giản thì kết quả là lượng calo nạp vào nhiều hơn calo tiêu hao, đương nhiên dễ bị béo phì.[2]</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 血糖过低时请勿开车</strong> (<em>Xuètáng guò dī shí qǐng wù kāichē</em>): Khi đường huyết quá thấp xin đừng lái xe[4].</li><li><strong>B. 不吃早餐很容易衰老</strong> (<em>Bù chī zǎocān hěn róngyì shuāilǎo</em>): Không ăn sáng rất dễ bị lão hóa[4].</li><li><strong>C. 吃好早餐不容易发胖</strong> (<em>Chī hǎo zǎocān bù róngyì fāpàng</em>): Ăn sáng đầy đủ/tốt thì không dễ bị béo phì[4].</li><li><strong>D. 应该选择低热量早餐</strong> (<em>Yīnggāi xuǎnzé dī rèliàng zǎocān</em>): Nên lựa chọn bữa sáng chứa calo thấp[4].</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>C</strong>[4]</li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe nêu rõ việc ăn bữa sáng đầy đủ calo kết hợp với trưa và tối hợp lý giúp cơ thể đốt cháy chất béo tốt hơn, không bị tích tụ mỡ nên không dễ bị béo phì[2].</li></ul><hr>"
      },
      {
        "number": 50,
        "title": "Câu 50",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>富含</strong> (<em>fù hán</em>): Giàu có, chứa nhiều[2].</li><li><strong>干点</strong> (<em>gān diǎn</em>): Bánh điểm tâm khô (bánh mì, bánh ngọt...)[2].</li><li><strong>水溶性维生素</strong> (<em>shuǐ róng xìng wéishēngsù</em>): Vitamin tan trong nước[2].</li><li><strong>酸碱平衡</strong> (<em>suān jiǎn píng héng</em>): Cân bằng axit - kiềm[2][3].</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 合理的早餐食品应该是富含水分和营养的。牛奶、豆浆符合上述要求，可任选一种，然后再加上其他干点。[2]</li><li><strong>Pinyin:</strong> Hélǐ de zǎocān shípǐn yīnggāi shì fùhán shuǐfèn hé yíngyǎng de. Niúnǎi, dòujiāng fúhé shàngshù yāoqiú, kě rènxuǎn yī zhǒng, ránhòu zài jiā shàng qítā gāndiǎn.[2]</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Thực phẩm cho một bữa sáng hợp lý nên là giàu nước và chất dinh dưỡng. Sữa bò, sữa đậu nành đáp ứng yêu cầu trên, có thể chọn một trong hai, sau đó ăn thêm các món điểm tâm khô khác.[2]</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 多吃蛋白质和蔬菜</strong> (<em>Duō chī dànbáizhì hé shūcài</em>): Ăn nhiều protein và rau củ[4].</li><li><strong>B. 富含水分和营养素</strong> (<em>Fùhán shuǐfèn hé yíngyǎngxù</em>): Giàu nước và chất dinh dưỡng[4].</li><li><strong>C. 多吃肉、蛋及谷物</strong> (<em>Duō chī ròu, dàn jí gǔwù</em>): Ăn nhiều thịt, trứng và ngũ cốc[4].</li><li><strong>D. 富含水分和纤维素</strong> (<em>Fùhán shuǐfèn hé xiānwéisù</em>): Giàu nước và chất xơ[4].</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>B</strong>[4]</li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe khẳng định trực tiếp: \"Thực phẩm cho một bữa sáng hợp lý nên là giàu nước và chất dinh dưỡng\" (<em>合理的早餐食品应该是富含水分和营养的</em>)[2].</li></ul><hr>"
      }
    ]
  }
];

</script>
<script>
(function(){
  if(window.NodeList && !NodeList.prototype.forEach){NodeList.prototype.forEach=Array.prototype.forEach;}
  var tabs=document.getElementById('tabs'), panels=document.getElementById('panels'), search=document.getElementById('search'), progress=document.getElementById('progress'), empty=document.getElementById('empty'), root=document.documentElement, active='';
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function content(q){
    if(q.contentHtml) return q.contentHtml;
    var out='';
    [['Transcript',q.transcript],['Pinyin',q.pinyin],['Dịch nghĩa',q.translation],['Từ vựng',q.vocabulary],['Phân tích đáp án',q.analysis]].forEach(function(pair){
      if(!pair[1] || (Array.isArray(pair[1])&&!pair[1].length)) return;
      out+='<section class="content-section"><h3>'+esc(pair[0])+'</h3>';
      if(pair[0]==='Từ vựng'&&Array.isArray(pair[1])){out+='<ul>'+pair[1].map(function(v){return '<li><strong>'+esc(v.word)+'</strong>'+(v.pinyin?' ('+esc(v.pinyin)+')':'')+' — '+esc(v.meaning)+'</li>';}).join('')+'</ul>';}
      else out+='<p>'+esc(pair[1])+'</p>';
      out+='</section>';
    });
    return out || '<p class="empty-content">Chưa điền nội dung. Có thể thêm transcript, pinyin, bản dịch, từ vựng và phân tích vào data.js.</p>';
  }
  function render(){
    var out='';
    window.HSK_EXAMS.forEach(function(exam,idx){
      var id='panel'+exam.id;
      tabs.innerHTML+='';
      var b=document.createElement('button');b.type='button';b.setAttribute('data-target',id);b.textContent=exam.title+' · '+exam.questions.length+' mục';b.className=idx===0?'active':'';tabs.appendChild(b);
      out+='<section class="panel '+(idx===0?'active':'')+'" id="'+id+'"><div class="shared-note">'+esc(exam.title.toUpperCase())+' · '+exam.questions.length+' mục</div><section class="questions">';
      exam.questions.forEach(function(q){var n=('0'+q.number).slice(-2);out+='<details class="question" id="e'+exam.id+'-q'+q.number+'"><summary><span class="number">'+n+'</span><span class="question-title">'+esc(q.title||('Câu '+q.number))+'</span><span class="chevron" aria-hidden="true">＋</span></summary><div class="answer">'+content(q)+'</div></details>';});
      out+='</section></section>';
    });
    panels.innerHTML=out; active='panel'+window.HSK_EXAMS[0].id;
    tabs.addEventListener('click',function(e){var b=e.target;while(b&&b!==tabs&&b.tagName!=='BUTTON'){b=b.parentNode;}if(!b||b===tabs)return;active=b.getAttribute('data-target');document.querySelectorAll('.panel').forEach(function(p){p.className='panel'+(p.id===active?' active':'');});tabs.querySelectorAll('button').forEach(function(x){x.className=x===b?'active':'';});search.value='';update();});
    document.addEventListener('toggle',function(e){if(e.target&&e.target.classList.contains('question'))update();},true);
    search.addEventListener('input',update);
    document.getElementById('openAll').onclick=function(){allBoxes().forEach(function(b){if(b.style.display!=='none')b.open=true;});update();};
    document.getElementById('closeAll').onclick=function(){document.querySelectorAll('.question').forEach(function(b){b.open=false;});update();};
    document.getElementById('fontUp').onclick=function(){root.style.fontSize=Math.min(25,(parseFloat(getComputedStyle(root).fontSize)||18)+1)+'px';};
    document.getElementById('fontDown').onclick=function(){root.style.fontSize=Math.max(15,(parseFloat(getComputedStyle(root).fontSize)||18)-1)+'px';}; update();
  }
  function allBoxes(){return document.querySelectorAll('.panel.active .question');}
  function update(){var boxes=allBoxes(),visible=0,opened=0,term=search.value.toLowerCase();boxes.forEach(function(b){var match=!term||b.textContent.toLowerCase().indexOf(term)!==-1;b.style.display=match?'':'none';if(match){visible++;if(b.open)opened++;}});progress.textContent=visible+' mục hiển thị · '+opened+' mục đang mở';empty.style.display=visible?'none':'block';}
  render();
})();
</script></body></html>

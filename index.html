        "contentHtml": "<h3>1\\. Từ vựng trọng tâm</h3><ul><li><strong>调查报告</strong> (<em>diào chá bào gào</em>): Báo cáo điều tra[1].</li><li><strong>单纯</strong> (<em>dān chún</em>): Đơn thuần, chỉ là[1].</li><li><strong>前提</strong> (<em>qián tí</em>): Tiền đề, điều kiện tiên quyết[2].</li><li><strong>方法</strong> (<em>fāng fǎ</em>): Phương pháp[1].</li></ul><hr><h3>2\\. Đoạn văn gốc (Bài nghe Câu 1)</h3><ul><li><strong>Tiếng Trung nguyên văn:</strong> 调查报告不是单纯写得好不好的问题，调查工作没有做好，用什么样的方法也写不好。[1]</li><li><strong>Pinyin:</strong> Diàochá bàogào bú shì dānchún xiě de hǎo bù hǎo de wèntí, diàochá gōngzuò méiyǒu zuò hǎo, yòng shénmeyàng de fāngfǎ yě xiě bù hǎo.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Báo cáo điều tra không đơn thuần là vấn đề viết có tốt hay không; nếu công tác điều tra chưa làm tốt, thì dùng phương pháp nào cũng không thể viết tốt được.</li></ul><hr><h3>3\\. Phương án lựa chọn A–D</h3><ul><li><strong>A. 写作水平高一定能写好调查报告</strong>[2]</li><li><em>Pinyin:</em> Xiězuò shuǐpíng gāo yīdìng néng xiě hǎo diàochá bàogào.</li><li><em>Dịch:</em> Trình độ viết lách cao nhất định sẽ viết tốt báo cáo điều tra.</li><li><strong>B. 写调查报告跟调查工作没有关系</strong>[2]</li><li><em>Pinyin:</em> Xiě diàochá bàogào gēn diàochá gōngzuò méiyǒu guānxi.</li><li><em>Dịch:</em> Viết báo cáo điều tra không có liên quan gì đến công tác điều tra.</li><li><strong>C. 调查报告对写作水平没什么要求</strong>[2]</li><li><em>Pinyin:</em> Diàochá bàogào duì xiězuò shuǐpíng méi shénme yāoqiú.</li><li><em>Dịch:</em> Báo cáo điều tra không đòi hỏi nhiều về trình độ viết lách.</li><li><strong>D. 调查工作是写好调查报告的前提</strong>[2]</li><li><em>Pinyin:</em> Diàochá gōngzuò shì xiě hǎo diàochá bàogào de qiántí.</li><li><em>Dịch:</em> Công tác điều tra là tiền đề để viết tốt báo cáo điều tra.</li></ul><hr><h3>4\\. Đáp án đúng &amp;amp; Giải thích</h3><ul><li><strong>Đáp án đúng:</strong> <strong>D</strong>[2]</li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe nhấn mạnh nếu \"công tác điều tra chưa làm tốt\" (<em>调查工作没有做好</em>) thì dùng cách nào cũng không thể viết tốt[1]. Do đó, việc làm tốt công tác điều tra chính là tiền đề quan trọng nhất để viết nên một bản báo cáo điều tra chất lượng[1][2].</li></ul><hr><p>🎧 Bạn có muốn tiếp tục phân tích <strong>Câu 2</strong> của Đề 1 theo đúng mẫu này không, hay muốn chuyển sang câu/đề khác?</p><p>có thể làm một dàn đc k</p><p><strong>Hoàn toàn được nhé!</strong> Mình có thể làm theo từng dàn (nhóm câu) để bạn tiện luyện tập[1][2].</p><p>Bạn có thể chọn 1 trong 2 cách triển khai dưới đây:</p><ol><li><strong>Phân tích theo từng dàn 5–10 câu ngay trong chat</strong>: Mình gửi từng nhóm câu (ví dụ: Câu 1–5, 6–10...) để bạn học đến đâu nắm chắc đến đó.</li><li><strong>Xuất thành 1 File tài liệu tổng hợp đầy đủ (PDF hoặc Markdown)</strong>: Mình sẽ tổng hợp trọn bộ Phần 1 (từ Câu 1 đến 15) hoặc toàn bộ Đề 1 (50 câu) thành một bộ tài liệu học tập hoàn chỉnh gồm từ vựng, transcript, dịch nghĩa và giải thích chi tiết để bạn tải về ôn tập.</li></ol><hr><p>Dưới đây là mẫu làm thử <strong>dàn 3 câu tiếp theo (Câu 2, 3, 4 - Đề 1)</strong> theo đúng cấu trúc 4 phần bạn yêu cầu[1][2]:</p>"

        "number": 2,
        "title": "Câu 2",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>趴</strong> (<em>pā</em>): Nằm sấp, ghé sát vào.</li><li><strong>埋葬</strong> (<em>mái zàng</em>): Chôn cất, mai táng.</li><li><strong>伤心不已</strong> (<em>shāng xīn bù yǐ</em>): Đau buồn khôn nguôi.</li><li><strong>果然</strong> (<em>guǒ rán</em>): Quả nhiên.</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 一个小女孩趴在窗口，看着人们埋葬她心爱的小狗，伤心不已[1]。祖父见状把她引到另一个窗口，让她欣赏窗外的玫瑰花园[1]。果然小女孩的心情好多了[1]。祖父刮刮她的下巴说：孩子，你开错了窗口[1]。</li><li><strong>Pinyin:</strong> Yī gè xiǎo nǚhái pā zài chuāngkǒu, kàn zhe rénmen máizàng tā xīn'ài de xiǎogǒu, shāngxīn bù yǐ. Zǔfù jiàn zhuàng bǎ tā yǐn dào lìng yī gè chuāngkǒu, ràng tā xīnshǎng chuāngwài de méiguī huāyuán. Guǒrán xiǎo nǚhái de xīnqíng hǎo duō le. Zǔfù guā guā tā de xiàba shuō: Háizi, nǐ kāi cuò le chuānghù.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Một cô bé ghé bên cửa sổ, nhìn người ta chôn cất chú chó cún yêu quý của mình, đau lòng khôn nguôi[1]. Người ông thấy vậy liền dẫn cô bé sang một cửa sổ khác, bảo cô ngắm nhìn vườn hoa hồng bên ngoài[1]. Quả nhiên tâm trạng cô bé tốt lên rất nhiều[1]. Người ông xoa cằm cô bé và nói: \"Cháu yêu, cháu đã mở nhầm cửa sổ rồi.\"[1]</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 看问题的角度不同会导致心情不同</strong> (<em>Kàn wèntí de jiǎodù bùtóng huì dǎozhì xīnqíng bùtóng</em>): Góc nhìn vấn đề khác nhau sẽ dẫn đến tâm trạng khác nhau[2].</li><li><strong>B. 环境对人的情绪状态有很大的影响</strong> (<em>Huánjìng duì rén de qíngxù zhuàngtài yǒu hěn dà de yǐngxiǎng</em>): Môi trường có ảnh hưởng lớn đến trạng thái cảm xúc[2].</li><li><strong>C. 人应该学会从不同角度去看待问题</strong> (<em>Rén yīnggāi xuéhuì cóng bùtóng jiǎodù qù kàndài wèntí</em>): Con người nên học cách nhìn nhận vấn đề từ các góc độ khác nhau[2].</li><li><strong>D. 不该让孩子看到与死亡有关的场景</strong> (<em>Bù gāi ràng háizi kàndào yǔ sǐwáng yǒuguān de chǎngjǐng</em>): Không nên để trẻ em nhìn thấy những cảnh liên quan đến cái chết[2].</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>A</strong>[2]</li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe thông qua hình ảnh hai khung cửa sổ (nhìn cún cún bị chôn thì buồn, nhìn vườn hoa hồng thì vui) để thể hiện rằng góc nhìn khác nhau dẫn đến tâm trạng khác nhau[1].</li></ul><hr>"
      },

        "number": 3,
        "title": "Câu 3",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>药酒</strong> (<em>yào jiǔ</em>): Rượu thuốc.</li><li><strong>保健酒</strong> (<em>bǎo jiàn jiǔ</em>): Rượu bổ/rượu bảo vệ sức khỏe.</li><li><strong>特征</strong> (<em>tè zhēng</em>): Đặc trưng, đặc điểm.</li><li><strong>监督</strong> (<em>jiān dū</em>): Giám sát, hướng dẫn.</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 很多人认为药酒就是保健酒，事实并非如此[1]。专家介绍，药酒主要以治疗疾病为主，必须取得国药准字号，有药物的基本特征，必须在医生监督下饮用，在正规医院药房或药店销售[1]。而保健酒以养生健体为主，没有治疗作用，产品上不能明确宣传其疗效[1]……</li><li><strong>Pinyin:</strong> Hěn duō rén rènwéi yàojiǔ jiù shì bǎojiànjiǔ, shìshí bìng fēi rúcǐ. Zhuānjiā jièshào, yàojiǔ zhǔyào yǐ zhìliáo jíbìng wéi zhǔ, bìxū qǔdé guó yào zhǔn zì hào, yǒu yàowù de jīběn tèzhēng, bìxū zài yīshēng jiāndū xià yǐnyòng, zài zhèngguī yīyuàn yàofáng huò yàodiàn xiāoshòu. Ér bǎojiànjiǔ yǐ yǎngshēng jiàntǐ wéi zhǔ, méiyǒu zhìliáo zuòyòng, chǎnpǐn shàng bùnéng míngquè xuānchuán qí liáoxiào...</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Nhiều người cho rằng rượu thuốc chính là rượu bổ, thực tế không phải vậy[1]. Chuyên gia giới thiệu, rượu thuốc chủ yếu dùng để chữa bệnh, phải có mã chứng nhận dược phẩm quốc gia, mang đặc trưng cơ bản của thuốc, phải uống dưới sự giám sát của bác sĩ và bán tại bệnh viện hoặc nhà thuốc chính quy[1]. Trong khi đó, rượu bổ chủ yếu để dưỡng sinh tăng cường sức khỏe, không có tác dụng chữa bệnh và không được quảng cáo rõ ràng về hiệu quả điều trị[1]...</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 保健酒兼有药酒的疗效</strong> (<em>Bǎojiànjiǔ jiān yǒu yàojiǔ de liáoxiào</em>): Rượu bổ kiêm luôn hiệu quả điều trị của rượu thuốc[2].</li><li><strong>B. 保健酒只在医院药房销售</strong> (<em>Bǎojiànjiǔ zhǐ zài yīyuàn yàofáng xiāoshòu</em>): Rượu bổ chỉ bán tại nhà thuốc bệnh viện[2].</li><li><strong>C. 药酒兼有保健酒的功效</strong> (<em>Yàojiǔ jiān yǒu bǎojiànjiǔ de gōngxiào</em>): Rượu thuốc kiêm luôn công dụng của rượu bổ[2].</li><li><strong>D. 药酒并不等同于保健酒</strong> (<em>Yàojiǔ bìng bù děngtóng yú bǎojiànjiǔ</em>): Rượu thuốc không hề đồng nghĩa/giống với rượu bổ[2].</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>D</strong>[2]</li><li><strong>Giải thích ngắn gọn:</strong> Ngay câu đầu bài nghe đã khẳng định \"Nhiều người cho rằng rượu thuốc chính là rượu bổ, thực tế không phải vậy\" (<em>事实并非如此</em>), sau đó phân tích điểm khác biệt giữa hai loại[1].</li></ul><hr>"

        "number": 4,
        "title": "Câu 4",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>香椿</strong> (<em>xiāng chūn</em>): Cây xoan tẩu/lá hương xuân (loại rau mầm hoa mộc).</li><li><strong>贡品</strong> (<em>gòng pǐn</em>): Cống vật, vật phẩm tiến cống.</li><li><strong>木本蔬菜</strong> (<em>mù běn shū cài</em>): Rau thân gỗ.</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 中国是唯一用香椿做蔬菜的国家[1]。香椿因其浓郁的清香、柔嫩的质地和丰富的营养，曾与荔枝一样在明清时期作为贡品，深受宫廷贵人的喜爱[1]。香椿中含有蛋白质、维生素E、钙、磷、铁多种元素，居木本蔬菜之首[1]。此外，香椿的根皮、果实都能入药[1]。</li><li><strong>Pinyin:</strong> Zhōngguó shì wéiyī yòng xiāngchūn zuò shūcài de guójiā. Xiāngchūn yīn qí nóngyù de qīngxiāng, róunèn de zhìdì hé fēngfù de yíngyǎng, céng yǔ lìzhī yīyàng zài Míng Qīng shíqī zuòwéi gòngpǐn, shēn shòu gōngtíng guìrén de xǐài. Xiāngchūn zhōng hánhǒu dànbáizhì, wéishēngsù E, gài, lín, tiě duō zhǒng yuánsù, jū mùběn shūcài zhī shǒu. Cǐwài, xiāngchūn de gēnpí, guǒshí dōu néng rùyào.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Trung Quốc là quốc gia duy nhất dùng lá hương xuân làm rau ăn[1]. Hương xuân nhờ hương thơm nồng nàn, kết cấu mềm mại và dinh dưỡng phong phú, từng cùng với quả vải làm cống vật thời Minh - Thanh, rất được quý tộc hoàng cung ưa chuộng[1]. Trong lá hương xuân chứa nhiều nguyên tố như protein, vitamin E, canxi, phốt pho, sắt, đứng đầu trong các loại rau thân gỗ[1]. Ngoài ra, vỏ rễ và quả của cây hương xuân đều có thể dùng làm thuốc[1].</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 可食用的香椿具有医用价值</strong> (<em>Kě shíyòng de xiāngchūn jùyǒu yīyòng jiàzhí</em>): Lá hương xuân ăn được có giá trị y học/làm thuốc[2].</li><li><strong>B. 香椿蛋白质含量超出其他蔬菜</strong> (<em>Xiāngchūn dànbáizhì hánliàng chāochū qítā shūcài</em>): Hàm lượng protein trong hương xuân vượt trội hơn các loại rau khác[2].</li><li><strong>C. 只有中国人的香椿才能做蔬菜</strong> (<em>Zhǐyǒu Zhōngguórén de xiāngchūn cái néng zuò shūcài</em>): Chỉ có hương xuân của người Trung Quốc mới làm rau được[2].</li><li><strong>D. 香椿在明清时期被广泛发现</strong> (<em>Xiāngchūn zài Míng Qīng shíqī bèi guǎngfàn fāxiàn</em>): Hương xuân được phát hiện rộng rãi vào thời Minh Thanh[2].</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>A</strong>[2]</li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe nêu rõ \"vỏ rễ, quả của hương xuân đều có thể dùng làm thuốc\" (<em>香椿的根皮、果实都能入药</em>), tương ứng với giá trị y học[1].</li></ul><hr><p>📌 Bạn muốn mình tiếp tục làm dàn tiếp theo <strong>(Câu 5–10)</strong> trong khung chat, hay muốn mình tạo một <strong>File tài liệu đầy đủ trọn bộ Đề 1</strong> để bạn lưu lại ôn tập?</p><p>Làm tiếp câu 5 đến câu 10 nhé</p><p>Dưới đây là chi tiết phân tích <strong>Câu 5 đến Câu 10 (Đề số 1)</strong> theo đúng cấu trúc 4 phần bạn yêu cầu:</p><hr>"
      },

        "number": 5,
        "title": "Câu 5",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>癌症</strong> (<em>ái zhèng</em>): Bệnh ung thư[1].</li><li><strong>发病率</strong> (<em>fā bìng lǜ</em>): Tỷ lệ phát bệnh[1].</li><li><strong>迅猛</strong> (<em>xùn měng</em>): Phát triển nhanh chóng và mạnh mẽ[2].</li><li><strong>生态失衡</strong> (<em>shēng tài shī héng</em>): Mất cân bằng sinh thái[2].</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 根据医学资料记载，全球癌症的发病率20世纪下半叶比上半叶增加了近十倍，成为威胁人类生命的第一杀手。这说明20世纪下半叶以高科技为标志的经济迅猛发展所造成的全球性生态失衡，是诱发癌症发生的主要原因。[1][2]</li><li><strong>Pinyin:</strong> Gēnjù yīxué zīliào jìzǎi, quánqiú áizhèng de fābìnglǜ 20 shìjì xiàbànyè bǐ shàngbànyè zēngjiā le jìn shí bèi, chéngwéi wēixié rénlèi shēngmìng de dì-yī shāshǒu. Zhè shuōmíng 20 shìjì xiàbànyè yǐ gāokējì wéi biāozhì de jīngjì xùnměng fāzhǎn suǒ zàochéng de quánqiúxìng shēngtài shīhéng, shì yòufā áizhèng fāshēng de zhǔyào yuányīn.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Theo ghi chép trong tài liệu y học, tỷ lệ mắc bệnh ung thư trên toàn cầu vào nửa cuối thế kỷ 20 đã tăng gần 10 lần so với nửa đầu thế kỷ, trở thành sát thủ số một đe dọa tính mạng con người[1]. Điều này cho thấy sự mất cân bằng sinh thái toàn cầu do nền kinh tế phát triển nhanh chóng gắn liền với công nghệ cao nửa cuối thế kỷ 20 gây ra chính là nguyên nhân chính dẫn đến sự bùng phát ung thư[2].</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 癌症成为导致人类死亡的唯一病因</strong> (<em>Áizhèng chéngwéi dǎozhì rénlèi sǐwáng de wéiyī bìngyīn</em>): Ung thư trở thành nguyên nhân gây tử vong duy nhất của con người[3].</li><li><strong>B. 经济的迅猛发展诱发了癌症的发生</strong> (<em>Jīngjì de xùnměng fāzhǎn yòufā le áizhèng de fāshēng</em>): Sự phát triển nhanh chóng của kinh tế trực tiếp gây ra ung thư[3].</li><li><strong>C. 高科技水平越高，癌症发病率越高</strong> (<em>Gāokējì shuǐpíng yuè gāo, áizhèng fābìnglǜ yuè gāo</em>): Trình độ công nghệ cao càng cao thì tỷ lệ mắc ung thư càng cao[3].</li><li><strong>D. 癌症的发生与全球生态失衡有关</strong> (<em>Áizhèng de fāshēng yǔ quánqiú shēngtài shīhéng yǒuguān</em>): Việc phát sinh bệnh ung thư có liên quan đến sự mất cân bằng sinh thái toàn cầu[3].</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>D</strong>[3]</li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe nêu rõ sự mất cân bằng sinh thái toàn cầu (<em>全球性生态失衡</em>) do kinh tế phát triển gây ra chính là nguyên nhân chính dẫn đến ung thư (<em>是诱发癌症发生的主要原因</em>)[2].</li></ul><hr>"

        "number": 6,
        "title": "Câu 6",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>储蓄</strong> (<em>chǔ xù</em>): Tiết kiệm, tiền gửi tiết kiệm[2].</li><li><strong>资源基础</strong> (<em>zī yuán jī chǔ</em>): Cơ sở nguồn lực[2].</li><li><strong>最大限度</strong> (<em>zuì dà xiàn dù</em>): Mức độ tối đa, kịch khung[2].</li><li><strong>适度</strong> (<em>shì dù</em>): Mức độ vừa phải, thích hợp[2].</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 储蓄是经济增长的资源基础，但最大限度的储蓄增长率绝不是最优的经济增长率，只有适度的储蓄才能保持经济健康发展。[2]</li><li><strong>Pinyin:</strong> Chǔxù shì jīngjì zēngzhǎng de zīyuán jīchǔ, dàn zuìdà xiàndù de chǔxù zēngzhǎnglǜ jué bú shì zuì yōu de jīngjì zēngzhǎnglǜ, zhǐyǒu shìdù de chǔxù cái néng bǎochí jīngjì jiànkāng fāzhǎn.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Tiết kiệm là cơ sở nguồn lực cho tăng trưởng kinh tế, nhưng tỷ lệ tăng trưởng tiết kiệm ở mức tối đa tuyệt đối không phải là tỷ lệ tăng trưởng kinh tế tối ưu; chỉ có mức tiết kiệm vừa phải mới giữ cho kinh tế phát triển lành mạnh[2].</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 储蓄的无限增长会影响经济的增长速度</strong> (<em>Chǔxù de wúxiàn zēngzhǎng huì yǐngxiǎng jīngjì de zēngzhǎng sùdù</em>): Tăng trưởng tiết kiệm vô hạn sẽ ảnh hưởng đến tốc độ tăng trưởng kinh tế[3].</li><li><strong>B. 储蓄的增长速度越快，经济增长速度越慢</strong> (<em>Chǔxù de zēngzhǎng sùdù yuè kuài, jīngjì zēngzhǎng sùdù yuè màn</em>): Tốc độ tăng tiết kiệm càng nhanh thì tốc độ tăng trưởng kinh tế càng chậm[3].</li><li><strong>C. 储蓄的无限增长会促进经济的增长速度</strong> (<em>Chǔxù de wúxiàn zēngzhǎng huì cùjìn jīngjì de zēngzhǎng sùdù</em>): Tăng trưởng tiết kiệm vô hạn sẽ thúc đẩy tốc độ tăng trưởng kinh tế[3].</li><li><strong>D. 经济增长速度会随着储蓄增长速度而加快</strong> (<em>Jīngjì zēngzhǎng sùdù huì suí zhe chǔxù zēngzhǎng sùdù ér jiākuài</em>): Tốc độ tăng trưởng kinh tế sẽ đẩy nhanh theo tốc độ tăng tiết kiệm[3].</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>A</strong>[3]</li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe nhấn mạnh \"tỷ lệ tăng tiết kiệm tối đa/vô hạn tuyệt đối không phải tối ưu\" (<em>最大限度的储蓄增长率绝不是最优的</em>), tức là tiết kiệm tăng quá đà không hề tốt mà sẽ tác động xấu đến tốc độ tăng trưởng kinh tế[2].</li></ul><hr>"
      },
      {
        "number": 7,
        "title": "Câu 7",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>内向</strong> (<em>nèi xiàng</em>): Hướng nội[2].</li><li><strong>无法企及</strong> (<em>wú fǎ qǐ jí</em>): Không thể với tới, không sánh kịp[2].</li><li><strong>专心致志</strong> (<em>zhuān xīn zhì zhì</em>): Chuyên tâm toàn ý, tập trung cao độ[2].</li><li><strong>概率</strong> (<em>gài lǜ</em>): Xác suất, tỷ lệ[2].</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 内向的人也许结交不是很广泛，但他们在工作上却有着外向的人无法企及的长处。与外向的人相比，内向害羞的人在处理视觉信息时，大脑某些区域更加活跃；同时在做决策时，他们愿意花大量时间思考，更能专心致志地奔着一个目标努力，因此他们成功的概率也更大。[2]</li><li><strong>Pinyin:</strong> Nèixiàng de rén yěxǔ jiéjiāo bú shì hěn guǎngfàn, dàn tāmen zài gōngzuò shàng què yǒu zhe wàixiàng de rén wúfǎ qǐjí de chángchù. Yǔ wàixiàng de rén xiāngbǐ, nèixiàng hàixiū de rén zài chǔlǐ shìjué xìnxī shí, dànǎo mǒu xiē qūyù gèngjiā huóyuè; tóngshí zài zuò juécè shí, tāmen yuànyì huā dàliàng shíjiān sīkǎo, gèng néng zhuānxīn-zhìzhì de bèn zhe yī gè mùbiāo nǔlì, yīncǐ tāmen chénggōng de gàilǜ yě gèng dà.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Người hướng nội có thể giao thiệp không rộng rãi, nhưng trong công việc họ lại có những điểm mạnh mà người hướng ngoại không thể sánh kịp[2]. So với người hướng ngoại, người hướng nội nhút nhát khi xử lý thông tin thị giác thì một số vùng não lại hoạt động tích cực hơn; đồng thời khi đưa ra quyết định, họ sẵn sàng dành nhiều thời gian suy nghĩ, dễ tập trung toàn ý hướng tới một mục tiêu nỗ lực, do đó xác suất thành công của họ cũng cao hơn[2].</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 性格内向对工作不利</strong> (<em>Xìnggé nèixiàng duì gōngzuò bùlì</em>): Tính cách hướng nội bất lợi cho công việc[3].</li><li><strong>B. 性格内向者更易成功</strong> (<em>Xìnggé nèixiàng zhě gèng yì chénggōng</em>): Người hướng nội dễ thành công hơn[3].</li><li><strong>C. 性格内向者不善表达</strong> (<em>Xìnggé nèixiàng zhě bú shàn biǎodá</em>): Người hướng nội không giỏi diễn đạt[3].</li><li><strong>D. 性格内向者更有智慧</strong> (<em>Xìnggé nèixiàng zhě gèng yǒu zhìhuì</em>): Người hướng nội có trí tuệ hơn[3].</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>B</strong>[3]</li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe kết luận rằng do người hướng nội tập trung và suy nghĩ kỹ càng khi ra quyết định nên \"xác suất thành công của họ cao hơn\" (<em>因此他们成功的概率也更大</em>), tương ứng với phương án B[2].</li></ul><hr>"
      },
      {
        "number": 8,
        "title": "Câu 8",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>发育</strong> (<em>fā yù</em>): Phát triển, tăng trưởng cơ thể[2].</li><li><strong>诱发</strong> (<em>yòu fā</em>): Dẫn đến, kích thích phát sinh[2].</li><li><strong>近视</strong> (<em>jìn shì</em>): Cận thị[2].</li><li><strong>衍生物</strong> (<em>yǎn shēng wù</em>): Dẫn xuất, chất dẫn xuất[2].</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 孩子在发育过程中，一方面个子不断长高，一方面眼球也在不断长大。如果饮食搭配不合理，肉吃得过多，而维生素、蔬菜摄入过少，就可能诱发近视。眼睛和维生素的关系非常密切，我们看物像是光化学过程，而这个光化学过程中所需的感光物质是紫红，正是维生素A的一种衍生物。[2]</li><li><strong>Pinyin:</strong> Háizi zài fāyù guòchéng zhōng, yī fāngmiàn gèzi bùduàn zhǎng gāo, yī fāngmiàn yǎnqiú yě zài bùduàn zhǎng dà. Rúguǒ yǐnshí dāpèi bù hélǐ, ròu chī de guò duō, ér wéishēngsù, shūcài shèrù guò shǎo, jiù kěnéng yòufā jìnshì. Yǎnjīng hé wéishēngsù de guānxi fēicháng mìqiè, wǒmen kàn wùxiàng shì guāng huàxué guòchéng, ér zhè ge guāng huàxué guòchéng zhōng suǒ xū de gǎnguāng wùzhì shì zǐhóng, zhèng shì wéishēngsù A de yī zhǒng yǎnshēngwù.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Trong quá trình phát triển của trẻ, một mặt chiều cao liên tục tăng, mặt khác nhãn cầu cũng liên tục to ra[2]. Nếu phối hợp chế độ ăn uống không hợp lý, ăn quá nhiều thịt mà lượng vitamin và rau quả nạp vào quá ít thì có thể gây ra cận thị[2]. Mối quan hệ giữa mắt và vitamin rất chặt chẽ, việc chúng ta nhìn thấy hình ảnh là một quá trình quang hóa, mà chất cảm quang cần thiết trong quá trình này là rhodopsin, chính là một dẫn xuất của vitamin A[2].</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 孩子应多吃肉以补充身体需要</strong> (<em>Háizi yīng duō chī ròu yǐ bǔchōng shēntǐ xūyào</em>): Trẻ em nên ăn nhiều thịt để bổ sung nhu cầu cơ thể[3].</li><li><strong>B. 孩子食用维生素可预防近视发生</strong> (<em>Háizi shíyòng wéishēngsù kě yùfáng jìnshì fāshēng</em>): Trẻ em dùng vitamin có thể phòng ngừa cận thị[3].</li><li><strong>C. 孩子缺乏维生素A易出现近视</strong> (<em>Háizi quēfá wéishēngsù A yì chūxiàn jìnshì</em>): Trẻ em thiếu vitamin A dễ bị cận thị[3].</li><li><strong>D. 肉类食物食用过多易诱发近视</strong> (<em>Ròu lèi shíwù shíyòng guò duō yì yòufā jìnshì</em>): Ăn quá nhiều thực phẩm từ thịt dễ gây ra cận thị[3].</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>D</strong>[3]</li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe nêu rõ \"nếu ăn quá nhiều thịt... thì có thể gây ra cận thị\" (<em>肉吃得过多... 就可能诱发近视</em>), tương ứng trực tiếp với phương án D[2].</li></ul><hr>"
      },
      {
        "number": 9,
        "title": "Câu 9",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>变化无常</strong> (<em>biàn huà wú cháng</em>): Biến đổi thất thường[2].</li><li><strong>回避</strong> (<em>huí bì</em>): Tránh né, trốn tránh[2].</li><li><strong>过敏</strong> (<em>guò mǐn</em>): Dị ứng[2].</li><li><strong>量力而行</strong> (<em>liàng lì ér xíng</em>): Lượng sức mà làm[2].</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 春天气候变化无常，时风时雨，外出春游时一定要备足衣服，携带雨具。有过敏病史的人要尽量回避有花之处，预防花粉过敏。要避免过度劳累，特别是患有慢性疾病的中老年人，更应量力而行。[2]</li><li><strong>Pinyin:</strong> Chūntiān qìhòu biànhuà wúcháng, shí fēng shí yǔ, wàichū chūnyóu shí yīdìng yào bèi zú yīfu, xiédài yǔjù. Yǒu guòmǐn bìngshǐ de rén yào jìnliàng huíbì yǒu huā zhī chù, yùfáng huāfěn guòmǐn. Yào bìmiǎn guòdù láolèi, tèbié shì huàn yǒu mànxìng jíbìng de zhōng-lǎonián rén, gèng yīng liànglì-érxíng.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Thời tiết mùa xuân biến đổi thất thường, lúc nắng lúc mưa, khi ra ngoài du xuân nhất định phải chuẩn bị đủ quần áo, mang theo đồ đi mưa[2]. Người có tiền sử dị ứng nên cố gắng tránh những nơi có hoa để phòng ngừa dị ứng phấn hoa[2]. Cần tránh mệt mỏi quá độ, đặc biệt là người trung niên và người già mắc bệnh mãn tính càng nên lượng sức mà làm[2].</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 外出春游时应注意个人卫生保健</strong> (<em>Wàichū chūnyóu shí yīng zhùyì gèrén wèishēng bǎojiàn</em>): Khi ra ngoài du xuân nên chú ý chăm sóc sức khỏe cá nhân[3].</li><li><strong>B. 患有慢性疾病的人春季不宜外出</strong> (<em>Huàn yǒu mànxìng jíbìng de rén chūnjì bù yí wàichū</em>): Người mắc bệnh mãn tính không nên ra ngoài vào mùa xuân[3].</li><li><strong>C. 气候变化无常人容易产生疲劳感</strong> (<em>Qìhòu biànhuà wúcháng rén róngyì chǎnshēng píláogǎn</em>): Thời tiết biến đổi thất thường khiến con người dễ bị mệt mỏi[3].</li><li><strong>D. 花粉过敏的人春季不宜外出旅游</strong> (<em>Huāfěn guòmǐn de rén chūnjì bù yí wàichū lǚyóu</em>): Người dị ứng phấn hoa không nên đi du lịch vào mùa xuân[3].</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>A</strong>[3]</li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe khuyên bảo vệ sức khỏe toàn diện khi đi chơi xuân (chuẩn bị đồ, tránh quá sức, né phấn hoa). Phương án B và D bị sai vì bài nghe chỉ khuyên người bệnh \"lượng sức mà làm\" hay \"tránh chỗ có hoa\" chứ không cấm ra ngoài[2].</li></ul><hr>"
      },

        "number": 10,
        "title": "Câu 10",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>心肌收缩力</strong> (<em>xīn jī shōu suō lì</em>): Lực co bóp cơ tim[2].</li><li><strong>规律</strong> (<em>guī lǜ</em>): Quy luật, nhịp điệu sinh học[2].</li><li><strong>疲倦不堪</strong> (<em>pí juàn bù kān</em>): Mệt mỏi kiệt sức[2].</li><li><strong>恶性循环</strong> (<em>è xìng xún huán</em>): Vòng lặp quẩn[4].</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 当人活动时，心跳加快，心肌收缩力增强，血流量增加；当人休息时，心脏也同样处于休息状态。如果长时间的睡眠就会破坏心脏活动和休息的规律，心脏一憩再憩，最终会收缩乏力，稍活动便心跳不已，疲倦不堪，全身乏力，因此只好躺下，形成恶性循环。[2][4]</li><li><strong>Pinyin:</strong> Dāng rén huódòng shí, xīntiào jiākuài, xīnjī shōusuōlì zēngqiáng, xuèliúliàng zēngjiā; dāng rén xiūxi shí, xīnzàng yě tóngyàng chǔyú xiūxi zhuàngtài. Rúguǒ cháng shíjiān de shuìmián jiù huì pòhuài xīnzàng huódòng hé xiūxi de guīlǜ, xīnzàng yī qì zài qì, zuìzhōng huì shōusuō fálì, shāo huódòng biàn xīntiào bù yǐ, píjuàn bù kān, quánshēn fálì, yīncǐ zhǐhǎo tǎng xià, xíngchéng èxìng xúnhuán.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Khi con người vận động, nhịp tim đập nhanh hơn, lực co bóp cơ tim tăng cường, lưu lượng máu tăng lên; khi con người nghỉ ngơi, trái tim cũng ở trạng thái nghỉ ngơi tương tự[2]. Nếu ngủ thời gian quá dài sẽ phá hỏng quy luật hoạt động và nghỉ ngơi của tim, khiến tim hết nghỉ ngơi lại tiếp tục nghỉ ngơi, cuối cùng co bóp yếu ớt, chỉ cần vận động nhẹ là tim đập liên hồi, mệt mỏi kiệt sức, toàn thân không có lực, vì vậy lại phải nằm xuống, tạo thành vòng lặp quẩn[2][4].</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 心脏同样也需要休息</strong> (<em>Xīnzàng tóngyàng yě xūyào xiūxi</em>): Trái tim cũng tương tự cần nghỉ ngơi[3].</li><li><strong>B. 运动会导致心脏衰弱</strong> (<em>Yùndòng huì dǎozhì xīnzàng shuāiruò</em>): Vận động sẽ dẫn đến suy tim[3].</li><li><strong>C. 睡眠过多使身体衰弱</strong> (<em>Shuìmián guò duō shǐ shēntǐ shuāiruò</em>): Ngủ quá nhiều làm cho cơ thể suy yếu[3].</li><li><strong>D. 心脏活动会影响睡眠</strong> (<em>Xīnzàng huódòng huì yǐngxiǎng shuìmián</em>): Hoạt động của tim sẽ ảnh hưởng đến giấc ngủ[3].</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>C</strong>[3]</li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe chỉ ra \"ngủ thời gian quá dài... cuối cùng sẽ dẫn đến mệt mỏi kiệt sức, toàn thân không có lực\" (<em>长时间的睡眠... 疲倦不堪，全身乏力</em>), tức là việc ngủ quá nhiều làm cơ thể suy yếu dần[2][4].</li></ul><hr><p>🌿 Bạn có muốn tiếp tục phân tích dàn câu tiếp theo <strong>(Câu 11–15 - 5 câu cuối cùng của Phần 1 Đề 1)</strong> không?</p><p>Làm tiếp câu 11 đến câu 15 nhé</p><p>Dưới đây là chi tiết phân tích <strong>Câu 11 đến Câu 15 (5 câu cuối cùng của Phần 1 — Đề số 1)</strong> theo đúng cấu trúc 4 phần bạn yêu cầu[1]:</p><hr>"

        "number": 11,
        "title": "Câu 11",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>子孙满堂</strong> (<em>zǐ sūn mǎn táng</em>): Con cháu đầy nhà, đông con nhiều cháu.</li><li><strong>提倡</strong> (<em>tí chàng</em>): Đề xướng, khuyến khích.</li><li><strong>反哺</strong> (<em>fǎn bǔ</em>): Phụng dưỡng cha mẹ.</li><li><strong>成才</strong> (<em>chéng cái</em>): Thành tài, nên người.</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 中国人传统的生活方式是子孙满堂，这一点令西方老年人很羡慕。儒家文化提倡“父母在，不远游”，贫困地区的父母更是把生男孩当作自己养老的保障。而有些西方人则认为培养孩子是一种社会责任，而不是自我牺牲，孩子的回报不是反哺父母，而是努力使自己成才。尽管西方国家有较为完善的社会福利制度来保障老年人的日常生活，但老年人在情感上与后代……</li><li><strong>Pinyin:</strong> Zhōngguórén chuántǒng de shēnghuó fāngshì shì zǐsūn-mǎntáng, zhè yīdiǎn lìng Xīfāng lǎoniánrén hěn xiànmù. Rújiā wénhuà tíchàng \"fùmǔ zài, bù yuǎnyóu\", pínkùn dìqū de fùmǔ gèng shì bǎ shēng nánhái dàngzuò zìjǐ yǎnglǎo de bǎozhàng. Ér yǒuxiē Xīfāngrén zé rènwéi péiyǎng háizi shì yī zhǒng shèhuì zérèn, ér bú shì zìwǒ xīshēng, háizi de huíbào bú shì fǎnbǔ fùmǔ, ér shì nǔlì shǐ zìjǐ chéngcái. Jǐnguǎn Xīfāng guójiā yǒu jiàowéi wánshàn de shèhuì fúlì zhìdù lái bǎozhàng lǎoniánrén de rìcháng shēnghuó, dàn lǎoniánrén zài qínggǎn shàng yǔ hòudài...</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Phương thức sống truyền thống của người Trung Quốc là con cháu đầy nhà, điều này khiến người già phương Tây rất ngưỡng mộ. Văn hóa Nho giáo đề xướng \"cha mẹ còn sống thì không đi xa\", cha mẹ ở các vùng nghèo khó càng coi việc sinh con trai là sự bảo đảm để dưỡng lão. Trong khi đó, một số người phương Tây cho rằng nuôi dạy con cái là một trách nhiệm xã hội chứ không phải là sự hy sinh bản thân; sự đền đáp của con cái không phải là phụng dưỡng cha mẹ, mà là nỗ lực làm cho bản thân thành tài. Mặc dù các nước phương Tây có chế độ phúc lợi xã hội khá hoàn thiện để bảo đảm cuộc sống hàng ngày cho người già, nhưng người già về mặt cảm xúc đối với thế hệ sau...</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 一般西方人更羡慕中国人的生活方式</strong> (<em>Yībān Xīfāngrén gèng xiànmù Zhōngguórén de shēnghuó fāngshì</em>): Người phương Tây nói chung ngưỡng mộ lối sống của người Trung Quốc hơn.</li><li><strong>B. 中西方文化差异造成对待子女态度不同</strong> (<em>Zhōng Xīfāng wénhuà chāyì zàochéng duìdài zǐnǚ tàidù bùtóng</em>): Sự khác biệt văn hóa Trung - Tây dẫn đến thái độ khác nhau đối với con cái.</li><li><strong>C. 中国的社会福利制度还需要进一步完善</strong> (<em>Zhōngguó de shèhuì fúlì zhìdù hái xūyào jìnyībù wánshàn</em>): Chế độ phúc lợi xã hội của Trung Quốc cần tiếp tục được hoàn thiện hơn nữa.</li><li><strong>D. 贫困地区的父母重男轻女观念还很严重</strong> (<em>Pínkùn dìqū de fùmǔ zhòngnán-qīngnǚ guāniàn hái hěn yánzhòng</em>): Cha mẹ ở các vùng nghèo khó quan niệm trọng nam khinh nữ vẫn còn rất nghiêm trọng.</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>B</strong></li><li><strong>Giải thích ngắn gọn:</strong> Đoạn văn đối chiếu quan niệm nuôi dạy và kỳ vọng ở con cái giữa văn hóa Nho giáo Trung Quốc và văn hóa phương Tây, cho thấy sự khác biệt văn hóa dẫn đến thái độ ứng xử khác nhau đối với con cái[2][3].</li></ul><hr>"

        "number": 12,
        "title": "Câu 12",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>存款量</strong> (<em>cún kuǎn liàng</em>): Lượng tiền gửi tiết kiệm.</li><li><strong>贷款能力</strong> (<em>dài kuǎn néng lì</em>): Năng lực cho vay.</li><li><strong>超出</strong> (<em>chāo chū</em>): Vượt quá, vượt mức.</li><li><strong>通货膨胀</strong> (<em>tōng huò péng zhàng</em>): Lạm phát (tiền tệ).</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 一般来说，银行获得的存款量决定了银行的贷款能力。但是在许多时候，银行的贷款数量会超出它所获得的存款数量，这是一个众所周知的事实。如果这种贷款的数量超出过多，就会造成通货膨胀。</li><li><strong>Pinyin:</strong> Yībān lái shuō, yínháng huòdé de cúnkuǎnliàng juédìng le yínháng de dàikuǎn nénglì. Dànshì zài xǔduō shíhou, yínháng de dàikuǎn shùliàng huì chāochū tā suǒ huòdé de cúnkuǎn shùliàng, zhè shì yī gè zhòngsuǒzhōuzhī de shìshí. Rúguǒ zhè zhǒng dàikuǎn de shùliàng chāochū guò duō, jiù huì zàochéng tōnghuò péngzhàng.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Nói chung, lượng tiền gửi mà ngân hàng huy động được sẽ quyết định năng lực cho vay của ngân hàng. Tuy nhiên trong nhiều trường hợp, số lượng tiền cho vay của ngân hàng sẽ vượt quá số lượng tiền gửi huy động được, đây là một sự thật mà ai cũng biết. Nếu số lượng cho vay này vượt quá quá nhiều thì sẽ gây ra lạm phát.</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 银行贷款客户越多，存款量就越多</strong> (<em>Yínháng dàikuǎn kèhù yuè duō, cúnkuǎnliàng jiù yuè duō</em>): Khách hàng vay tiền ngân hàng càng nhiều thì lượng tiền gửi càng nhiều.</li><li><strong>B. 存款数量少于贷款量就会出现通货膨胀</strong> (<em>Cúnkuǎn shùliàng shǎo yú dàikuǎnliàng jiù huì chūxiàn tōnghuò péngzhàng</em>): Lượng tiền gửi ít hơn lượng tiền cho vay (vượt quá mức) sẽ xuất hiện lạm phát.</li><li><strong>C. 存款人所得利益随贷款额度而变化</strong> (<em>Cúnkuǎnrén suǒdé lìyì suí dàikuǎn édù ér biànhuà</em>): Lợi ích của người gửi tiền thay đổi theo hạn mức cho vay.</li><li><strong>D. 银行存款客户越多，贷款量就越多</strong> (<em>Yínháng cúnkuǎn kèhù yuè duō, dàikuǎnliàng jiù yuè duō</em>): Khách hàng gửi tiền ngân hàng càng nhiều thì lượng tiền cho vay càng nhiều.</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>B</strong></li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe nêu rõ nếu lượng cho vay vượt quá lượng tiền gửi quá nhiều (<em>贷款的数量超出过多</em> \\= lượng tiền gửi ít hơn lượng cho vay đáng kể) thì sẽ dẫn đến lạm phát (<em>造成通货膨胀</em>)[2][3].</li></ul><hr>"
      },
      {
        "number": 13,
        "title": "Câu 13",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>高山反应</strong> (<em>gāo shān fǎn yìng</em>): Phản ứng cao sơn (say độ cao).</li><li><strong>缺氧</strong> (<em>quē yǎng</em>): Thiếu oxy.</li><li><strong>症状</strong> (<em>zhèng zhuàng</em>): Triệu chứng bệnh.</li><li><strong>脑血管阻塞</strong> (<em>nǎo xuè guǎn zǔ sè</em>): Tắc mạch máu脑/tắc mạch máu brain.</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 通常的高山反应是由高海拔地区空气中缺氧造成的。当吸氧条件改变时，症状会很快消失。由于具有脑缺氧的急性脑血管阻塞的症状与高山反应类似， tap…… 所以在高海拔地区……</li><li><strong>Pinyin:</strong> Tōngcháng de gāoshān fǎnyìng shì yóu gāohǎibá dìqū kōngqì zhōng quēyǎng zàochéng de. Dāng xīyǎng tiáojiàn gǎibiàn shí, zhèngzhuàng huì hěn kuài xiāoshī. Yóuyú jùyǒu nǎoquēyǎng de jíxìng nǎoxuèguǎn zǔsè de zhèngzhuàng yǔ gāoshān fǎnyìng lèisì, suǒyǐ zài gāohǎibá dìqū...</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Phản ứng cao sơn thông thường là do thiếu oxy trong không khí ở khu vực cao nguyên gây ra. Khi điều kiện hít thở oxy thay đổi (được bổ sung oxy), các triệu chứng sẽ nhanh chóng biến mất. Do chứng tắc mạch máu não cấp tính có hiện tượng thiếu oxy脑 cũng có triệu chứng tương tự như phản ứng cao sơn, cho nên ở khu vực độ cao lớn...</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 高山反应和急性脑血管阻塞是由缺氧引起的</strong> (<em>Gāoshān fǎnyìng hé jíxìng nǎoxuèguǎn zǔsè shì yóu quēyǎng yǐnqǐ de</em>): Phản ứng cao sơn và tắc mạch máu脑 cấp tính đều do thiếu oxy gây ra.</li><li><strong>B. 高海拔地区空气中的氧含量比平原地区高得多</strong> (<em>Gāohǎibá dìqū kōngqì zhōng de yǎng hánliàng bǐ píngyuán dìqū gāo de duō</em>): Hàm lượng oxy không khí vùng cao nguyên cao hơn nhiều so với đồng bằng.</li><li><strong>C. 高海拔地区缺少急性脑血管阻症病人的条件</strong> (<em>Gāohǎibá dìqū quēshǎo jíxìng nǎoxuèguǎn zǔzhèng bìngrén de tiáojiàn</em>): Vùng cao nguyên thiếu điều kiện cho bệnh nhân tắc mạch máu brain cấp tính.</li><li><strong>D. 高山反应如不及时吸氧则易诱发急性脑血管阻塞</strong> (<em>Gāoshān fǎnyìng rú bù jíshí xīyǎng zé yì yòufā jíxìng nǎoxuèguǎn zǔsè</em>): Phản ứng cao sơn nếu không thở oxy kịp thời dễ gây ra tắc mạch máu brain cấp tính.</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>A</strong></li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe cho biết phản ứng cao sơn do thiếu oxy (<em>缺氧</em>) gây ra, còn tắc mạch máu brain cấp tính cũng có đặc điểm do thiếu oxy brain (<em>脑缺氧</em>)[2][3].</li></ul><hr>"
      },

        "number": 14,
        "title": "Câu 14",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>息息相关</strong> (<em>xī xī xiāng guān</em>): Liên quan gắn bó chặt chẽ, gắn liền.</li><li><strong>准确</strong> (<em>zhǔn què</em>): Chính xác.</li><li><strong>可能性</strong> (<em>kě néng xìng</em>): Khả năng, tính khả thi.</li><li><strong>弄不好</strong> (<em>nòng bù hǎo</em>): Không khéo, nếu không cẩn thận.</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 天气预报与人们的生产生活息息相关。准确的天气预报使人们实现活动结果的可能性比较大，而天气预报也有不准的时候，弄不好就会给人们的正常活动带来……</li><li><strong>Pinyin:</strong> Tiānqì yùbào yǔ rénmen de shēngchǎn shēnghuó xīxī-xiāngguān. Zhǔnquè de tiānqì yùbào shǐ rénmen shíxiàn huódòng jiéguǒ de kěnéngxìng bǐjiào dà, ér tiānqì yùbào yě yǒu bù zhǔn de shíhou, nòng bù hǎo jiù huì gěi rénmen de zhèngcháng huódòng dàilái...</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Dự báo thời tiết có liên quan chặt chẽ đến hoạt động sản xuất và đời sống của con người. Dự báo thời tiết chính xác giúp khả năng đạt được kết quả như mong muốn trong các hoạt động của con người cao hơn; tuy nhiên dự báo thời tiết cũng có lúc không chính xác, nếu không cẩn thận sẽ mang lại rắc rối cho hoạt动 bình thường của con người...</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 人们在生产生活中不能完全相信天气预报</strong> (<em>Rénmen zài shēngchǎn shēnghuó zhōng bùnéng wánquán xiāngxìn tiānqì yùbào</em>): Con người trong sản xuất và đời sống không thể hoàn toàn tin vào dự báo thời tiết.</li><li><strong>B. 准确的天气预报对人们生产生活很重要</strong> (<em>Zhǔnquè de tiānqì yùbào duì rénmen shēngchǎn shēnghuó hěn zhòngyào</em>): Dự báo thời tiết chính xác rất quan trọng đối với sản xuất và đời sống của con người.</li><li><strong>C. 人们由于过于依赖天气预报而遭受损失</strong> (<em>Rénmen yóuyú guòyú yīlài tiānqì yùbào ér zāoshòu sǔnshī</em>): Con người chịu tổn thất do quá phụ thuộc vào dự báo thời tiết.</li><li><strong>D. 天气预报准确的时候比不准确的时候多</strong> (<em>Tiānqì yùbào zhǔnquè de shíhou bǐ bù zhǔnquè de shíhou duō</em>): Thời gian dự báo thời tiết chính xác nhiều hơn thời gian không chính xác.</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>B</strong></li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe khẳng định dự báo thời tiết gắn liền với đời sống (<em>与人们的生产生活息息相关</em>) và việc dự báo chính xác đem lại hiệu quả cao cho các hoạt động sản xuất, sinh hoạt[2][3].</li></ul><hr>"
      },

        "number": 15,
        "title": "Câu 15",
        "contentHtml": "<h4>1\\. Từ vựng trọng tâm</h4><ul><li><strong>衰减</strong> (<em>shuāi jiǎn</em>): Suy giảm, suy yếu dần.</li><li><strong>推移</strong> (<em>tuī yí</em>): Trôi qua, trôi đi (thời gian).</li><li><strong>间隔</strong> (<em>jiàn gé</em>): Khoảng cách, khoảng thời gian ngắt quãng.</li><li><strong>遗忘进程</strong> (<em>yí wàng jìn chéng</em>): Tiến trình quên.</li></ul><h4>2\\. Đoạn văn gốc</h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 实验证明，记忆后在大脑中保留的经验随时间的推移而逐渐衰减。这种衰减在学习后的短时间内特别迅速，但经过较长时间的间隔后，虽然在记忆中保留的数量减少了，提…… 但遗忘进程却比以前要缓慢得多。</li><li><strong>Pinyin:</strong> Shíyàn zhèngmíng, jìyì hòu zài dànǎo zhōng bǎoliú de jīngyàn suí shíjiān de tuīyí ér zhújiàn shuāijiǎn. Zhè zhǒng shuāijiǎn zài xuéxí hòu de duǎn shíjiān nèi tèbié xùnsù, dàn jīngguò jiào cháng shíjiān de jiàngé hòu, suīrán zài jìyì zhōng bǎoliú de shùliàng jiǎnshǎo le, dàn yíwàng jìnchéng què bǐ yǐqián yào huǎnmàn de duō.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Thí nghiệm chứng minh rằng kinh nghiệm lưu lại trong bộ não sau khi ghi nhớ sẽ giảm dần theo thời gian. Sự suy giảm này đặc biệt nhanh chóng trong thời gian ngắn ngay sau khi học, nhưng sau một khoảng thời gian dài hơn, tuy số lượng lưu giữ trong ký ức giảm đi nhưng tiến trình quên lại chậm hơn trước rất nhiều.</li></ul><h4>3\\. Phương án lựa chọn A–D</h4><ul><li><strong>A. 记忆衰减遵循先快后慢的规律</strong> (<em>Jìyì shuāijiǎn zūnxún xiān kuài hòu màn de guīlǜ</em>): Sự suy giảm ký nhớ tuân theo quy luật trước nhanh sau chậm.</li><li><strong>B. 短时间内不断重复可克服遗忘</strong> (<em>Duǎn shíjiān nèi bùduàn chóngfù kě kèfú yíwàng</em>): Lặp lại liên tục trong thời gian ngắn có thể khắc phục sự quên.</li><li><strong>C. 随时间推移大脑不会保留记忆</strong> (<em>Suí shíjiān tuīyí dànǎo bú huì bǎoliú jìyì</em>): Theo thời gian trôi qua bộ não sẽ không giữ lại ký ức.</li><li><strong>D. 长时间内多次重复可克服遗忘</strong> (<em>Cháng shíjiān nèi duō cì chóngfù kě kèfú yíwàng</em>): Lặp lại nhiều lần trong thời gian dài có thể khắc phục sự quên.</li></ul><h4>4\\. Đáp án đúng &amp;amp; Giải thích</h4><ul><li><strong>Đáp án đúng:</strong> <strong>A</strong></li><li><strong>Giải thích ngắn gọn:</strong> Bài nghe miêu tả trong thời gian ngắn sau khi học thì suy giảm nhanh (<em>短时间内特别迅速</em>), sau một khoảng thời gian dài hơn thì tiến trình quên chậm hơn (<em>遗忘进程却比以前要缓慢得多</em>). Đây chính là quy luật \"trước nhanh sau chậm\" (先快后慢)[2][3].</li></ul><hr>"
      },

        "number": 16,
        "title": "Câu 16",
        "contentHtml": "<ul><li><strong>A. 志同道合善于用人</strong> (<em>Zhìtóng-dàohé shànyú yòngrén</em>): Cùng chí hướng và giỏi dùng người[3].</li><li><strong>B. 发展及管理的眼光</strong> (<em>Fāzhǎn jí guǎnlǐ de yǎnguāng</em>): Tầm nhìn phát triển và quản lý[3].</li><li><strong>C. 安置亲信担任要职</strong> (<em>Ānzhì qīnxìn dānrèn yàozhí</em>): Bố trí người thân tín đảm nhận vị trí quan trọng[3].</li><li><strong>D. 以大局为重不排外</strong> (<em>Yǐ dàjú wéi zhòng bù páiwài</em>): Lấy đại cục làm trọng, không bài ngoại[3].</li></ul>"

        "contentHtml": "<ul><li><strong>A. 主人翁意识强</strong> (<em>Zhǔrénwēng yìshí qiáng</em>): Ý thức làm chủ cao[3].</li><li><strong>B. 用人成本较低</strong> (<em>Yòngrén chéngběn jiàodī</em>): Chi phí sử dụng nhân sự thấp hơn[3].</li><li><strong>C. 忠诚凝聚力强</strong> (<em>Zhōngchéng níngjùlì qiáng</em>): Lòng trung thành và sức gắn kết cao[3].</li><li><strong>D. 方向推进决策快</strong> (<em>Fāngxiàng tuījìn juécè kuài</em>): Thúc đẩy hướng đi và ra quyết định nhanh chóng[3].</li></ul>"

        "number": 20,
        "title": "Câu 20",
        "contentHtml": "<ul><li><strong>A. 人才资源不足</strong> (<em>Réncái zīyuán bùzú</em>): Nguồn tài nguyên nhân lực thiếu hụt[3].</li><li><strong>B. 领导者素质低</strong> (<em>Lǐngdǎozhě sùzhì dī</em>): Tố chất người lãnh đạo thấp[3].</li><li><strong>C. 缺乏创新眼光</strong> (<em>Quēfá chuàngxīn yǎnguāng</em>): Thiếu tầm nhìn đổi mới[3].</li><li><strong>D. 自负目中无人</strong> (<em>Zìfù mùzhōng-wúrén</em>): Tự phụ, không coi ai ra gì[3].</li></ul><hr><h3>4\\. Đáp án đúng &amp;amp; Giải thích</h3><ul><li><strong>Câu 16: Đáp án B</strong></li><li><em>Giải thích:</em> Bài nghe khẳng định trực tiếp: \"Mấu chốt của doanh nghiệp gia đình là tầm nhìn phát triển và quản lý\" (<em>家族企业的关键是发展及管理的眼光</em>)[2].</li><li><strong>Câu 17: Đáp án B</strong></li><li><em>Giải thích:</em> Người nam nêu rõ: \"Vấn đề lớn nhất của doanh nghiệp gia đình nằm ở chỗ ông chủ sẽ bất chấp tất cả lấy lợi ích của mình làm trung tâm\" (<em>家族企业最大的问题在于老板会不顾一切地以自己的利益为中心</em>)[2].</li><li><strong>Câu 18: Đáp án A</strong></li><li><em>Giải thích:</em> Khi so sánh với doanh nghiệp cổ phần/liên doanh, người nam cho rằng \"đôi khi bất đồng ý kiến là rào cản lớn nhất đối với sự phát triển của doanh nghiệp\" (<em>因为有时意见的分歧是对企业发展最大的制约</em>)[4].</li><li><strong>Câu 19: Đáp án D</strong></li><li><em>Giải thích:</em> Khi nói về ưu thế, bài nghe mô tả doanh nghiệp gia đình khi đã nhìn chuẩn hướng đi thì có thể lập tức hành động như vị tướng trên chiến trường (<em>看准了一个发展方向... 马上付出行动</em>), giúp định hướng và ra quyết định rất nhanh[4].</li><li><strong>Câu 20: Đáp án A</strong></li><li><em>Giải thích:</em> Khi phân tích nhược điểm, bài nghe kết luận: \"Sự thiếu hụt nguồn tài nguyên nhân lực sẽ trở thành vấn đề lớn nhất ảnh hưởng đến sự phát triển của doanh nghiệp gia đình\" (<em>人才资源的不足将成为影响家族企业发展的最大问题</em>)[4].</li></ul><hr><p>🎧 Bạn có muốn tiếp tục làm <strong>Bài phỏng vấn số 2 (Câu 21–25 - Bài nghe về thương hiệu Starbucks)</strong> theo đúng cấu trúc này không?</p><p>Làm tiếp câu 21 đến câu 25 nhé</p><p>Dưới đây là phân tích chi tiết <strong>Bài phỏng vấn số 2 (Câu 21 đến Câu 25) — Đề số 1</strong> thuộc Phần 2 (Chủ đề: <em>Sự thành công của thương hiệu Starbucks / 星巴克</em>):</p><hr><h3>1\\. Từ vựng trọng tâm</h3><ul><li><strong>老掉牙</strong> (<em>lǎo diào yá</em>): Cũ rích, lỗi thời.</li><li><strong>商业模式</strong> (<em>shāng yè mó shì</em>): Mô hình kinh doanh.</li><li><strong>边际成本</strong> (<em>biān jì chéng běn</em>): Chi phí biên / chi phí cận biên.</li><li><strong>跨国人口流动</strong> (<em>kuà guó rén kǒu liú dòng</em>): Sự di chuyển dân số xuyên quốc gia.</li><li><strong>协同效果</strong> (<em>xié tóng xiào guǒ</em>): Hiệu ứng hiệp đồng, hiệu quả phối hợp.</li><li><strong>融资</strong> (<em>róng zī</em>): Huy động vốn, gọi vốn.</li></ul><hr><h3>2\\. Đoạn văn gốc (Bài phỏng vấn)</h3><ul><li><strong>Nữ (Hỏi):</strong> 餐馆和制造公司的运营成本、材料成本很高，那为什么还有人去开餐馆、制造公司呢？这本身不就说明这些行业还能赚钱吗？</li><li><em>Pinyin:</em> Cānguǎn hé zhìzào gōngsī de yùnyíng chéngběn, cáiliào chéngběn hěn gāo, nà wèishénme hái yǒu rén qù kāi cānguǎn, zhìzào gōngsī ne? Zhè běnshēn bù jiù shuōmíng zhèxiē hángyè hái néng zhuànqián ma?</li><li><em>Dịch:</em> Chi phí vận hành, chi phí nguyên vật liệu của nhà hàng và công ty sản xuất rất cao, vậy tại sao vẫn có người mở nhà hàng, công ty sản xuất? Bản thân điều đó chẳng phải cho thấy những ngành này vẫn kiếm được tiền sao?</li><li><strong>Nam (Đáp):</strong> 的确是这样，各个行业都有赚钱的机会，关键还得看有没有办法降低成本或者巧妙地创新商业模式。比如说星巴克咖啡的创始人霍华德·舒尔茨通过开咖啡馆成了亿万富翁，他在1985年成立星巴克公司的前身，今天星巴克的市值是数百亿美元，短短30多年内， he 就/他就在有300多年历史的传统行业里创造出了这个奇迹。</li><li><em>Pinyin:</em> Díquè shì zhèyàng, gè gè hángyè dōu yǒu zhuànqián de jīhuì, guānjiàn hái děi kàn yǒu méiyǒu bànfǎ jiàngdī chéngběn huòzhě qiǎomiào de chuàngxīn shāngyè móshì. Bǐrú shuō Xīngbākè kāfēi de chuàngshǐrén Huòhuádé Shū'ěrcí tōngguò kāi kāfēiguǎn chéng le yìwàn fùwēng, tā zài 1985 nián chénglì Xīngbākè gōngsī de qiánshēn, jīntiān Xīngbākè de shìzhí shì shù bǎi yì Měiyuán, duǎnduǎn 30 duō nián nèi, tā jiù zài yǒu 300 duō nián lìshǐ de chuántǒng hángyè lǐ chuàngzào chū le zhè gè qíjī.</li><li><em>Dịch:</em> Đúng là như vậy, ngành nghề nào cũng có cơ hội kiếm tiền, mấu chốt vẫn phải xem có cách nào giảm bớt chi phí hoặc đổi mới mô hình kinh doanh một cách khéo léo hay không. Ví dụ như người sáng lập cà phê Starbucks, Howard Schultz, đã trở thành tỷ phú nhờ mở quán cà phê. Ông thành lập tiền thân của công ty Starbucks vào năm 1985, ngày nay giá trị thị trường của Starbucks là hàng chục tỷ USD, chỉ trong ngắn ngủi hơn 30 năm, ông đã tạo nên kỳ tích này trong một ngành truyền thống có lịch sử hơn 300 năm.</li><li><strong>Nữ (Hỏi):</strong> 这我就不明白了，像星巴克这样没有新技术的老掉牙的行业，怎么还有机会呢？</li><li><em>Pinyin:</em> Zhè wǒ jiù bù míngbai le, xiàng Xīngbākè zhèyàng méiyǒu xīn kējì de lǎodiàoyá de hángyè, zěnme hái yǒu jīhuì ne?</li><li><em>Dịch:</em> Điều này thì tôi không hiểu lắm, một ngành cũ kỹ không có công nghệ mới như Starbucks thì làm sao còn có cơ hội cơ chứ?</li><li><strong>Nam (Đáp):</strong> 首先在于规模，星巴克现在差不多有1.3万家分店，遍布全球，这是星巴克跟微软类似的地方，都有广大的消费群体。</li><li><em>Pinyin:</em> Shǒuxiān zàiyú guīmó, Xīngbākè xiànzài chàbuduō yǒu 1.3 wàn jiā fēndiàn, biànbù quánqiú, zhè shì Xīngbākè gēn Wēiruǎn lèisì de dìfang, dōu yǒu guǎngdà de xiāofèi qúntǐ.</li><li><em>Dịch:</em> Đầu tiên là ở quy mô, Starbucks hiện có khoảng 13.000 cửa hàng chi nhánh trên toàn cầu. Đây là điểm Starbucks giống với Microsoft, đều có lượng khách hàng tiêu dùng rộng lớn.</li><li><strong>Nữ (Hỏi):</strong> 为什么星巴克的品牌这么好，世界各地的人都愿意去，都愿意为星巴克咖啡付这么高的价格？他们是不是花很多钱做广告？</li><li><em>Pinyin:</em> Wèi shénme Xīngbākè de pǐnpái zhèmè hǎo, shìjiè gèdì de rén dōu yuànyì qù, dōu yuànyì wèi Xīngbākè kāfēi fù zhèmè gāo de jiàgé? Tāmen shì bú shì huā hěn duō qián zuò guǎnggào?</li><li><em>Dịch:</em> Tại sao thương hiệu của Starbucks lại tốt như vậy, người dân khắp nơi trên thế giới đều sẵn lòng đến đó và trả giá cao như vậy cho một ly cà phê? Có phải họ chi rất nhiều tiền để quảng cáo không?</li><li><strong>Nam (Đáp):</strong> 这个问题问得好，的确几乎所有公司都要花大钱做广告，以此在消费者群体中建立信任和形象。可星巴克不一样，虽然他没有花过一分钱做广告，但他的品牌却是全球咖啡行业中最响的，这是星巴克成功最大的秘诀。</li><li><em>Pinyin:</em> Zhè gè wèntí wèn de hǎo, díquè jīhū suǒyǒu gōngsī dōu yào huā dà qián zuò guǎnggào, yǐcǐ zài xiāofèizhě qúntǐ zhōng jiànlì xìnrèn hé xíngxiàng. Kě Xīngbākè bù yīyàng, suīrán tā méiyǒu huā guò yī fēn qián zuò guǎnggào, dàn tā de pǐnpái què shì quánqiú kāfēi hángyè zhōng zuì xiǎng de, zhè shì Xīngbākè chénggōng zuì dà de mìjué.</li><li><em>Dịch:</em> Câu hỏi này rất hay. Đúng là hầu như công ty nào cũng phải tốn khoản tiền lớn làm quảng cáo để gây dựng niềm tin và hình ảnh trong lòng người tiêu dùng. Nhưng Starbucks thì khác, tuy không tốn một xu quảng cáo nào nhưng thương hiệu của họ lại nổi tiếng nhất trong ngành cà phê toàn cầu, đây chính là bí quyết thành công lớn nhất của Starbucks.</li><li><strong>Nữ (Hỏi):</strong> 为什么星巴克不用花钱做广告就能建立顶尖品牌形象呢？</li><li><em>Pinyin:</em> Wèi shénme Xīngbākè bùyòng huā qián zuò guǎnggào jiù néng jiànlì dǐngjiān pǐnpái xíngxiàng ne?</li><li><em>Dịch:</em> Tại sao Starbucks không cần tốn tiền quảng cáo mà vẫn xây dựng được hình ảnh thương hiệu hàng đầu?</li><li><strong>Nam (Đáp):</strong> 最重要的因素就是全球化和全球范围内的人口流动，这为星巴克这样的品牌连锁店带来了空前的机会。就像我吧，经常在世界各地跑，不管到哪，我都没有时间，也没有兴趣了解当地的咖啡馆，因此如果一看到星巴克，很自然，我肯定就会去那里，因为我熟悉他们的咖啡单和咖啡口味，一进去就知道要什么。换句话说，一旦星巴克把我变成了顾客，我就成了世界各地星巴克的顾客。因此是全球化带来的跨国人口流动造就了星巴克，为星巴克节省了广告开支，使他每一杯咖啡的边际成本都很低。</li><li><em>Pinyin:</em> Zuì zhòngyào de yīnsù jiùshì quánqiúhuà hé quánqiú fànwéi nèi de rénkǒu liúdòng, zhè wèi Xīngbākè zhèyàng de pǐnpái liánsuǒdiàn dàilái le kōngqián de jīhuì. Jiù xiàng wǒ ba, jīngcháng zài shìjiè gèdì pǎo, bùguǎn dào nǎ, wǒ dōu méiyǒu shíjiān, yě méiyǒu xìngqù liǎojiě dāngdì de kāfēiguǎn, yīncǐ rúguǒ yī kàndào Xīngbākè, hěn zìrán, wǒ kěndìng jiù huì qù nàlǐ, yīnwèi wǒ shúxī tāmen de kāfēidān hé kāfēi kǒuwèi, yī jìnqù jiù zhīdào yào shénme. Huàn jù huà shuō, yīdàn Xīngbākè bǎ wǒ biànchéng le gùkè, wǒ jiù chéng le shìjiè gèdì Xīngbākè de gùkè. Yīncǐ shì quánqiúhuà dàilái de kuàguó rénkǒu liúdòng zàojiù le Xīngbākè, wèi Xīngbākè jiéshěng le guǎnggào kāizhī, shǐ tā měi yī bēi kāfēi de biānjì chéngběn dōu hěn dī.</li><li><em>Dịch:</em> Yếu tố quan trọng nhất chính là toàn cầu hóa và sự di chuyển dân số trên phạm vi toàn cầu, điều này mang lại cơ hội chưa từng có cho các chuỗi cửa hàng thương hiệu như Starbucks. Như tôi chẳng hạn, thường xuyên đi khắp thế giới, dù đến đâu tôi cũng không có thời gian lẫn hứng thú tìm hiểu quán cà phê bản địa, nên hễ nhìn thấy Starbucks là rất tự nhiên tôi sẽ vào đó, vì tôi quen thuộc với thực đơn và hương vị của họ, vừa vào là biết chọn gì. Nói cách khác, một khi Starbucks biến tôi thành khách hàng thì tôi đã trở thành khách hàng của Starbucks trên toàn thế giới. Do đó, chính sự di chuyển dân số xuyên quốc gia do toàn cầu hóa mang lại đã tạo nên Starbucks, giúp họ tiết kiệm chi phí quảng cáo và làm cho chi phí biên của mỗi ly cà phê đều rất thấp.</li><li><strong>Nam (Đáp tiếp):</strong> 还有就是从一开始星巴克就选择只在最繁华的市区交叉路口开咖啡店，虽然这些地段租金很高，但非常醒目的位置给星巴克带来了最自然的广告效果，过往的人不可能看不到招牌门面，看得次数多了，品牌信任自然就来。有一点很关键，就是人们在各地各国间的流动要具有规模，要频繁，也就是空运、高速公路等交通网络必须很发达，跨国旅行得很方便，否则这种跨地区跨国的品牌协同效果就很差。这就是为什么在20世纪80年代全球化重新启动之前，即使有人想像舒尔茨先生那样去创办全球连锁咖啡馆也难以成功的原因。</li><li><em>Pinyin:</em> Hái yǒu jiùshì cóng yī kāishǐ Xīngbākè jiù xuǎnzé zhǐ zài zuì fánhuá de shìqū jiāochālùkǒu kāi kāfēidiàn, suīrán zhèxiē dìduàn zūjīn hěn gāo, dàn fēicháng xǐngmù de wèizhì gěi Xīngbākè dàilái le zuì zìrán de guǎnggào xiàoguǒ, guòwǎng de rén bù kěnéng kàn bú dào zhāopái ménmiàn, kàn de cìshù duō le, pǐnpái xìnrèn zìrán jiù lái. Yǒu yīdiǎn hěn guānjiàn, jiùshì rénmen zài gèdì gèguó jiān de liúdòng yào jùyǒu guīmó, yào pínfán, yě jiùshì kōngyùn, gāosù gōnglù děng jiāotōng wǎngluò bìxū hěn fādá, kuàguó lǚxíng de hěn fāngbiàn, fǒuzé zhè zhǒng kuà dìqū kuàguó de pǐnpái xiétóng xiàoguǒ jiù hěn chà. Zhè jiùshì wèi shénme zài 20 shìjì 80 nián dài quánqiúhuà chóngxīn qǐdòng zhīqián, jíshǐ yǒu rén xiǎng xiàng Shū'ěrcí xiānsheng nàyàng qù chuàngbàn quánqiú liánsuǒ kāfēiguǎn yě nányǐ chénggōng de yuányīn.</li><li><em>Dịch:</em> Thêm vào đó, ngay từ đầu Starbucks đã chọn chỉ mở quán cà phê ở những ngã tư sầm uất nhất nội thành, tuy tiền thuê đất ở đây rất cao nhưng vị trí cực kỳ bắt mắt này mang lại hiệu quả quảng cáo tự nhiên nhất cho Starbucks, người qua kẻ lại không thể không nhìn thấy biển hiệu mặt tiền, nhìn nhiều lần tự nhiên sẽ sinh ra niềm tin thương hiệu. Có một điểm rất mấu chốt, đó là việc di chuyển giữa các nơi và các nước của người dân phải có quy mô và thường xuyên, tức là mạng lưới giao thông như đường hàng không, đường bộ cao tốc phải rất phát triển, du lịch xuyên quốc gia phải rất thuận tiện, nếu không hiệu quả hiệp đồng thương hiệu xuyên khu vực xuyên quốc gia sẽ rất kém. Đây chính là lý do vì sao trước khi làn sóng toàn cầu hóa tái khởi động vào những năm 1980, dù có người muốn thành lập chuỗi quán cà phê toàn cầu như ông Schultz cũng khó lòng thành công.</li></ul><hr><h3>3\\. Phương án lựa chọn A–D</h3>"
      },

        "contentHtml": "<ul><li><strong>A. 产品宣传</strong> (<em>Chǎnpǐn xuānchuán</em>): Quảng cáo sản phẩm.</li><li><strong>B. 降低成本</strong> (<em>Jiàngdī chéngběn</em>): Giảm bớt chi phí.</li><li><strong>C. 价格优势</strong> (<em>Jiàgé yōushì</em>): Ưu thế về giá.</li><li><strong>D. 品牌效应</strong> (<em>Pǐnpái xiàoguǒ</em>): Hiệu ứng thương hiệu.</li></ul>"

        "number": 22,
        "title": "Câu 22",
        "contentHtml": "<ul><li><strong>A. 人员素质</strong> (<em>Rényuán sùzhì</em>): Tố chất nhân viên.</li><li><strong>B. 咖啡品质</strong> (<em>Kāfēi pǐnzhì</em>): Chất lượng cà phê.</li><li><strong>C. 价格优势</strong> (<em>Jiàgé yōushì</em>): Ưu thế giá cả.</li><li><strong>D. 公司规模</strong> (<em>Gōngsī guīmó</em>): Quy mô công ty.</li></ul>"

      {
        "number": 23,
        "title": "Câu 23",
        "contentHtml": "<ul><li><strong>A. 拥有广大的消费群体</strong> (<em>Yǒngyǒu guǎngdà de xiāofèi qúntǐ</em>): Có lượng khách hàng tiêu dùng rộng lớn.</li><li><strong>B. 铺天盖地的广告投入</strong> (<em>Pūtiāngàidì de guǎnggào tóurù</em>): Chi phí quảng cáo rầm rộ.</li><li><strong>C. 拥有相同的消费群体</strong> (<em>Yǒngyǒu xiāngtóng de xiāofèi qúntǐ</em>): Có cùng tập khách hàng.</li><li><strong>D. 属同一行业知名品牌</strong> (<em>Shǔ tóngyī hángyè zhīmíng pǐnpái</em>): Thuộc thương hiệu nổi tiếng cùng ngành.</li></ul>"
      },
      {
        "number": 24,
        "title": "Câu 24",
        "contentHtml": "<ul><li><strong>A. 优惠的价格以及大众的口味</strong> (<em>Yōuhuì de jiàgé yǐjí dàzhòng de kǒuwèi</em>): Giá ưu đãi và hương vị đại chúng.</li><li><strong>B. 针对星巴克顾客的优惠政策</strong> (<em>Zhēnduì Xīngbākè gùkè de yōuhuì zhèngcè</em>): Chính sách ưu đãi cho khách Starbucks.</li><li><strong>C. 全球化带来的跨国人口流动</strong> (<em>Quánqiúhuà dàilái de kuàguó rénkǒu liúdòng</em>): Sự di chuyển dân số xuyên quốc gia do toàn cầu hóa.</li><li><strong>D. 通过广告建立公众信任形象</strong> (<em>Tōngguò guǎnggào jiànlì gōngzhòng xìnrèn xíngxiàng</em>): Xây dựng niềm tin nhờ quảng cáo.</li></ul>"
      },
      {
        "number": 25,
        "title": "Câu 25",
        "contentHtml": "<ul><li><strong>A. 跨国经营的品牌效应</strong> (<em>Kuàguó jīngyíng de pǐnpái xiàoguǒ</em>): Hiệu ứng thương hiệu kinh doanh xuyên quốc gia.</li><li><strong>B. 得天独厚的地理位置</strong> (<em>Détiān-dútòu de dìlǐ wèizhì</em>): Vị trí địa lý đắc địa.</li><li><strong>C. 交通网络的高度发达</strong> (<em>Jiāotōng wǎngluò de gāodù fādá</em>): Mạng lưới giao thông cực kỳ phát triển.</li><li><strong>D. 拥有众多巴菲特股东</strong> (<em>Yǒngyǒu zhòngduō Bāfēitè gǔdōng</em>): Có nhiều cổ đông như Buffett.</li></ul><hr><h3>4\\. Đáp án đúng &amp;amp; Giải thích</h3><ul><li><strong>Câu 21: Đáp án B</strong></li><li><em>Giải thích:</em> Bài nghe khẳng định mấu chốt để các ngành nghề kiếm được tiền nằm ở: \"有没有办法降低成本或者巧妙地创新商业模式\" (có cách nào giảm bớt chi phí hoặc đổi mới mô hình kinh doanh).</li><li><strong>Câu 22: Đáp án D</strong></li><li><em>Giải thích:</em> Khi giải thích vì sao một ngành cũ kỹ như Starbucks lại thành công, người nam nêu lý do đầu tiên: \"首先在于规模，星巴克现在差不多有1.3万家分店\" (Đầu tiên nằm ở quy mô, có khoảng 13.000 chi nhánh).</li><li><strong>Câu 23: Đáp án A</strong></li><li><em>Giải thích:</em> Người nam nói điểm tương đồng giữa Starbucks và Microsoft: \"这是星巴克跟微软类似的地方，都有广大的消费群体\" (Đều có lượng khách hàng tiêu dùng rộng lớn).</li><li><strong>Câu 24: Đáp án C</strong></li><li><em>Giải thích:</em> Bài nghe nhấn mạnh lý do Starbucks không tốn tiền quảng cáo mà vẫn nổi tiếng: \"是全球化带来的跨国人口流动造就了星巴克，为星巴克节省了广告开支\" (Chính sự di chuyển dân số xuyên quốc gia do toàn cầu hóa mang lại đã tạo nên Starbucks và tiết kiệm chi phí quảng cáo).</li><li><strong>Câu 25: Đáp án A</strong></li><li><em>Giải thích:</em> Đoạn phỏng vấn tổng kết rằng chính sự di chuyển dân số và quy mô toàn cầu tạo ra hiệu ứng thương hiệu kinh doanh xuyên quốc gia (<em>跨国经营的品牌效应</em>).</li></ul><hr><p>🎧 Bạn có muốn tiếp tục phân tích <strong>Bài phỏng vấn số 3 (Câu 26–30 - Chủ đề về quyền riêng tư trong hôn nhân / 婚姻与隐私)</strong> không?</p><p>tiếp đi</p><p>Dưới đây là phân tích chi tiết <strong>Bài phỏng vấn số 3 (Câu 26 đến Câu 30) — Đề số 1</strong> thuộc Phần 2 (Chủ đề: <em>Quyền riêng tư trong hôn nhân / 婚姻与隐私</em>)[1]:</p><hr><h3>1\\. Từ vựng trọng tâm</h3><ul><li><strong>隐私</strong> (<em>yǐn sī</em>): Quyền riêng tư, bí mật cá nhân[1].</li><li><strong>提倡</strong> (<em>tí chàng</em>): Đề xướng, khuyến khích[1].</li><li><strong>窥探</strong> (<em>kuī tàn</em>): Rình mò, dòm ngó đời tư[1].</li><li><strong>难以启齿</strong> (<em>nán yǐ qǐ chǐ</em>): Khó mở lời, khó nói ra[1].</li><li><strong>坦诚</strong> (<em>tǎn chéng</em>): Thành thật, bộc bạch cởi mở[1].</li><li><strong>豪猪理论</strong> (<em>háo zhū lǐ lùn</em>): Lý thuyết con nhím (giữ khoảng cách thích hợp để vừa sưởi ấm vừa không đâm đau nhau)[2].</li><li><strong>勃然大怒</strong> (<em>bó rán dà nù</em>): Nổi đình nổi bác, giận dữ lôi đình[2].</li><li><strong>导火索</strong> (<em>dǎo huǒ suǒ</em>): Ngòi nổ, nguyên nhân châm ngòi[2].</li><li><strong>水至清则无鱼，人至察则无徒</strong> (<em>shuǐ zhì qīng zé wú yú, rén zhì chá zé wú tú</em>): Nước trong quá thì không có cá, người xét nét quá thì không có bạn[2].</li><li><strong>难得糊涂</strong> (<em>nán dé hú tu</em>): Hiếm có lúc ngơ ngác/ngốc nghếch (ngụ ý trong hôn nhân nên bao dung, mắt nhắm mắt mở)[2].</li><li><strong>润滑剂</strong> (<em>rùn huá jì</em>): Chất bôi trơn[2].</li><li><strong>橱窗</strong> (<em>chú chuāng</em>): Tủ kính trưng bày[2].</li><li><strong>天窗</strong> (<em>tiān chuāng</em>): Cửa sổ mái, cửa giếng trời[2].</li></ul><hr><h3>2\\. Đoạn văn gốc (Bài phỏng vấn)</h3><h4><strong>Lời của người Nữ:</strong></h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 在现代社会中，心中存有隐私是不可避免的，但不等于说有隐私就有利于婚姻家庭。</li><li><strong>Pinyin:</strong> Zài xiàndài shèhuì zhōng, xīnzhōng cún yǒu yǐnsī shì bùkě bìmiǎn de, dàn bù děngtóng yú shuō yǒu yǐnsī jiù yǒu lì yú hūnyīn jiātíng.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Trong xã hội hiện đại, trong lòng có bí mật riêng là điều không thể tránh khỏi, nhưng không có nghĩa là có bí mật riêng thì có lợi cho hôn nhân gia đình[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 我觉得那些不和谐的家庭就是因为隐私太多了吧，所以应当提倡无隐私家庭，即使这一点不容易做到， me 也要努力争取。</li><li><strong>Pinyin:</strong> Wǒ juéde nàxiē bù héxié de jiātíng jiùshì yīnwèi yǐnsī tài duō le ba, suǒyǐ yīngdāng tíchàng wú yǐnsī jiātíng, jíshǐ zhè yīdiǎn bù róngyì zuòdào, wǒmen yě yào nǔlì zhēngqǔ.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Tôi cảm thấy những gia đình không hòa thuận chính là do có quá nhiều bí mật riêng, vì vậy nên đề xướng gia đình không có bí mật riêng, dù điều này không dễ làm được thì chúng ta cũng phải nỗ lực hướng tới[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 如果不能容忍对方的缺点和错误，与真诚之爱还有较大距离，那么这样的夫妻就只能在窥探与反窥探中生活。</li><li><strong>Pinyin:</strong> Rúguǒ bùnéng róngrěn duìfāng de quēdiǎn hé cuòwù, yǔ zhēnchéng zhī ài hái yǒu jiào dà jùlí, nàme zhèyàng de fūqī jiù zhǐnéng zài kuītàn yǔ fǎn kuītàn zhōng shēnghuó.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Nếu không thể bao dung khuyết điểm và sai lầm của đối phương, cách xa tình yêu chân thành, thì vợ chồng như vậy chỉ có thể sống trong cảnh rình mò và chống rình mò nhau[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 有的话现在可以不说，但不能视为隐私，视为隐私的无疑是永远都难以启齿的吧。</li><li><strong>Pinyin:</strong> Yǒu de huà xiànzài kěyǐ bù shuō, dàn bùnéng shìwéi yǐnsī, shìwéi yǐnsī de wúyí shì yǒngyuǎn dōu nányǐ qǐchǐ de ba.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Có những lời hiện tại có thể chưa nói, nhưng không thể coi là bí mật riêng, điều coi là bí mật riêng chắc chắn là điều mãi mãi khó mở lời[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 不愿意说不能算隐私，不能说的才是隐私。当然不是说对什么人都不能说，只是对有的人不能说才是隐私。</li><li><strong>Pinyin:</strong> Bù yuànyì shuō bùnéng suàn yǐnsī, bùnéng shuō de cái shì yǐnsī. Dāngrán bú shì shuō duì shénme rén dōu bùnéng shuō, zhǐshì duì yǒu de rén bùnéng shuō cái shì yǐnsī.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Không muốn nói thì không tính là bí mật riêng, không thể nói mới là bí mật riêng. Tất nhiên không phải nói đối với ai cũng không thể nói, mà chỉ là đối với một số người không thể nói mới tính là bí mật riêng[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 如果是真心相爱的夫妻，还有什么不能说的呢？只要彼此坦诚，说一点过去的生活苦中又有何不可呢？</li><li><strong>Pinyin:</strong> Rúguǒ shì zhēnxīn xiāng'ài de fūqī, hái yǒu shénme bùnéng shuō de ne? Zhǐyào bǐcǐ tǎnchéng, shuō yīdiǎn guòqù de shēnghuó kǔ zhōng yòu yǒu hé bùkě ne?</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Nếu là vợ chồng chân thành yêu thương nhau thì còn điều gì không thể nói ra? Chỉ cần hai bên chân thành bộc bạch, nói một chút về nỗi khổ cuộc sống quá khứ thì có gì là không thể chứ?[1]</li><li><strong>Tiếng Trung nguyên văn:</strong> 我觉得没有隐私是坦诚的最高境界，也是婚姻的最高境界。</li><li><strong>Pinyin:</strong> Wǒ juéde méiyǒu yǐnsī shì tǎnchéng de zuìgāo jìngjiè, yě shì hūnyīn de zuìgāo jìngjiè.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Tôi thấy không có bí mật riêng là cảnh giới cao nhất của sự thành thật, cũng là cảnh giới cao nhất của hôn nhân[1].</li></ul><hr><h4><strong>Lời của người Nam:</strong></h4><ul><li><strong>Tiếng Trung nguyên văn:</strong> 有点隐私也不至于不坦诚，只是说隐私太多了，坦诚也就没有土壤了。</li><li><strong>Pinyin:</strong> Yǒu diǎn yǐnsī yě bú zhìyú bù tǎnchéng, zhǐshì shuō yǐnsī tài duō le, tǎnchéng yě jiù méiyǒu tǔrǎng le.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Có một chút bí mật riêng cũng không đến mức là không thành thật, chỉ là bí mật quá nhiều thì sự thành thật cũng không còn đất sống[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 我的意见是追求至高境界，心中少点隐私。你有保留隐私的权利，但不等于夫妻之间要有各自的隐私，只要彼此相爱，没有隐私更坦诚。</li><li><strong>Pinyin:</strong> Wǒ de yìjiàn shì zhuīqiú zhìgāo jìngjiè, xīnzhōng shǎo diǎn yǐnsī. Nǐ yǒu bǎoliú yǐnsī de quánlì, dàn bù děngtóng yú fūqī zhījiān yào yǒu gèzì de yǐnsī, zhǐyào bǐcǐ xiāng'ài, méiyǒu yǐnsī gèng tǎnchéng.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Ý kiến của tôi là theo đuổi cảnh giới cao nhất, trong lòng bớt bí mật riêng đi. Bạn có quyền giữ bí mật cá nhân, nhưng không đồng nghĩa vợ chồng phải có bí mật riêng của từng người, chỉ cần yêu thương nhau thì không có bí mật riêng sẽ thành thật hơn[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 隐私在字典里的意思是“不愿告人的或不愿公开的个人的事”。我觉得夫妻间允许保有隐私是对方的尊重，也是一种文明与涵养的表现。</li><li><strong>Pinyin:</strong> Yǐnsī zài zìdiǎn lǐ de yìsi shì \"bù yuàn gào rén de huò bù yuàn gōngkāi de gèrén de shì\". Wǒ juéde fūqī jiān yǔnxǔ bǎoyǒu yǐnsī shì duìfāng de zūnzhòng, yě shì yī zhǒng wénmíng yǔ hányǎng de biǎoxiàn.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Bí mật riêng trong từ điển có nghĩa là \"chuyện cá nhân không muốn nói cho người khác hoặc không muốn công khai\". Tôi cảm thấy giữa vợ chồng cho phép giữ quyền riêng tư là sự tôn trọng đối phương, cũng là biểu hiện của sự văn minh và tu dưỡng[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 夫妻之间亲密也该有间，夫妻之间应该是拥有而不是占有。</li><li><strong>Pinyin:</strong> Fūqī zhījiān qīnmì yě gāi yǒu jiān, fūqī zhījiān yīnggāi shì yǒngyǒu ér bú shì zhànyǒu.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Thân mật giữa vợ chồng cũng nên có khoảng cách, vợ chồng nên là sở hữu chứ không phải chiếm hữu[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 我想大家都知道豪猪理论吧，豪猪生长在非洲，身上的毛硬而尖，天气寒冷的时候，它们就聚在一起，互相取暖，但是当靠近时，身上的尖毛会刺痛对方，而使它们立刻分开。</li><li><strong>Pinyin:</strong> Wǒ xiǎng dàjiā dōu zhīdào háozhū lǐlùn ba, háozhū shēngzhǎng zài Fēizhōu, shēnshang de máo yìng ér jiān, tiānqì hánlěng de shíhou, tāmen jiù jù zài yīqǐ, hùxiāng qǔnuǎn, dànshì dāng kàojìn shí, shēnshang de jiānmáo huì cìtòng duìfāng, ér shǐ tāmen lìkè fēnkāi.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Tôi nghĩ mọi người đều biết lý thuyết con nhím nhỉ, con nhím sống ở châu Phi, lông trên người vừa cứng vừa nhọn, khi thời tiết lạnh giá chúng tụ lại với nhau để sưởi ấm cho nhau, nhưng khi đến gần, lông nhọn trên người sẽ làm đau đối phương khiến chúng lập tức tách ra[2].</li><li><strong>Tiếng Trung nguyên văn:</strong> 分开后，因为寒冷，它们又会聚在一起，聚在一起，因为疼又再分开，这样反复数次，最后它们终于找到了彼此间的最佳距离，在最轻的疼痛下得到最大的温暖。夫妻之间也情同此理。</li><li><strong>Pinyin:</strong> Fēnkāi hòu, yīnwèi hánlěng, tāmen yòu huì jù zài yīqǐ, jù zài yīqǐ, yīnwèi téng yòu zài fēnkāi, zhèyàng fǎnfù shù cì, zuìhòu tāmen zhōngyú zhǎodào le bǐcǐ jiān de zuìjiā jùlí, zài zuì qīng de téngtòng xià dédào zuì dà de wēnnuǎn. Fūqī zhījiān yě qíng tóng cǐ lǐ.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Tách ra rồi vì lạnh chúng lại tụ lại, tụ lại rồi vì đau lại tách ra, lặp đi lặp lại nhiều lần như vậy, cuối cùng chúng đã tìm được khoảng cách tối ưu giữa nhau, nhận được sự sưởi ấm lớn nhất dưới cơn đau nhẹ nhất. Giữa vợ chồng đạo lý cũng tương tự[2].</li><li><strong>Tiếng Trung nguyên văn:</strong> 我想我们很多人可能都经历过或听说过这样的事情，一对夫妻原本很恩爱，可某一天丈夫知道了妻子曾经的过失，或妻子知道了丈夫曾经的浪漫，于是醋意大发，勃然大怒，猜疑争吵相继出现，婚姻也亮起了红灯。</li><li><strong>Pinyin:</strong> Wǒ xiǎng wǒmen hěn duō rén kěnéng dōu jīnglì guò huò tīngshuō guò zhèyàng de shìqing, yī duì fūqī yuánběn hěn ēn'ài, kě mǒu yī tiān zhàngfu zhīdào le qīzi céngjīng de guòshī, huò qīzi zhīdào le zhàngfu céngjīng de làngmàn, yúshì cùyì dàfā, bórán dànù, cāiyí zhēngchǎo xiāngjì chūxiàn, hūnyīn yě liàng qǐ le hóngdēng.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Tôi nghĩ nhiều người trong chúng ta có thể từng trải qua hoặc nghe nói những chuyện như vậy, một cặp vợ chồng vốn rất mặn nồng, nhưng một ngày nọ người chồng biết được sai lầm quá khứ của vợ, hoặc người vợ biết được sự lãng mạn quá khứ của chồng, thế là nổi ghen đùng đùng, giận dữ lôi đình, nghi ngờ cãi vã nối tiếp xuất hiện, hôn nhân cũng báo động đỏ[2].</li><li><strong>Tiếng Trung nguyên văn:</strong> 这样的例子并不少，而发生的导火索常常是一件过去的事。有些夫妻认为对婚姻的忠诚就是彻底坦白，这样才对得起爱情。而事实上我们追求的爱情应该是现在和将来，过去的就让它过去吧，适当的距离可以给爱情一个喘息的空间。</li><li><strong>Pinyin:</strong> Zhèyàng de lìzi bìng bù shǎo, ér fāshēng de dǎohuǒsuǒ chángcháng shì yī jiàn guòqù de shì. Yǒuxiē fūqī rènwéi duì hūnyīn de zhōngchéng jiùshì chèdǐ tǎnbái, zhèyàng cái duìdeqǐ àiqíng. Ér shìshí shàng wǒmen zhuīqiú de àiqíng yīnggāi shì xiànzài hé jiānglái, guòqù de jiù ràng tā guòqù ba, shìdàng de jùlí kěyǐ gěi àiqíng yī gè chuǎnxī de kōngjiān.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Những ví dụ như vậy không hề ít, mà nguyên nhân châm ngòi thường là một chuyện trong quá khứ. Có những cặp vợ chồng cho rằng sự trung thành với hôn nhân chính là thành thật triệt để, như vậy mới xứng đáng với tình yêu. Nhưng thực tế tình yêu chúng ta theo đuổi nên là hiện tại và tương lai, quá khứ hãy để nó qua đi, khoảng cách thích hợp có thể cho tình yêu một khoảng không hít thở[2].</li><li><strong>Tiếng Trung nguyên văn:</strong> 水至清则无鱼，人至察则无徒，难得糊涂乃是上策。婚姻就要睁一只眼闭一只眼，这样才能保持和谐快乐幸福的状态，而夫妻间彼此留下一些空间，应该是夫妻关系的润滑剂吧。</li><li><strong>Pinyin:</strong> Shuǐ zhì qīng zé wú yú, rén zhì chá zé wú tú, nán dé hú tu nǎi shì shàngcè. Hūnyīn jiù yào zhēng yī zhī yǎn bì yī zhī yǎn, zhèyàng cái néng bǎochí héxié kuàilè xìngfú de zhuàngtài, ér fūqī jiān bǐcǐ liú xià yīxiē kōngjiān, yīnggāi shì fūqī guānxi de rùnhuájì ba.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Nước quá trong thì không có cá, người quá xét nét thì không có bạn, 'hiếm có lúc ngờ nghệch' mới là thượng sách. Hôn nhân cần phải mắt nhắm mắt mở, như vậy mới giữ được trạng thái hòa hợp, vui vẻ, hạnh phúc, còn việc giữa vợ chồng để lại cho nhau chút khoảng không chính là chất bôi trơn cho mối quan hệ vợ chồng[2].</li><li><strong>Tiếng Trung nguyên văn:</strong> 常言道，恋爱是橱窗，结婚是天窗，也就是说热恋中的男女都把自己最美好的东西展示给对方，以博得好感使恋爱发展成婚姻。而婚后彼此一览无余，就像从天窗看室内，没有什么看不见的，透明度十分高。我认为夫妻之间除了襟怀坦白外，还应该有点包容的爱，彼此都有保留自己隐私和秘密的权利。</li><li><strong>Pinyin:</strong> Chángyán dào, liàn'ài shì chúchuāng, jiéhūn shì tiānchuāng, yě jiùshì shuō rèliàn zhōng de nánnǚ dōu bǎ zìjǐ zuì měihǎo de dōngxi zhǎnshì gěi duìfāng, yǐ bódé hǎogǎn shǐ liàn'ài fāzhǎn chéng hūnyīn. Ér hūnhòu bǐcǐ yīlǎn-wúyú, jiù xiàng cóng tiānchuāng kàn shìnèi, méiyǒu shénme kàn bú dào de, tòumíngdù shífēn gāo. Wǒ rènwéi fūqī zhījiān chúle jīnhuái-tǎnbái wài, hái yīnggāi yǒu diǎn bāoróng de ài, bǐcǐ dōu yǒu bǎoliú zìjǐ yǐnsī hé mìmì de quánlì.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Tục ngữ có câu: Yêu đương là tủ kính trưng bày, kết hôn là cửa sổ mái, tức là nam nữ trong lúc đắm say đều đem những gì đẹp đẽ nhất của mình phô diễn cho đối phương xem để giành thiện cảm khiến tình yêu phát triển thành hôn nhân. Còn sau khi kết hôn nhìn nhau rõ mùng mọt, giống như nhìn từ cửa sổ mái vào trong phòng, không có gì là không thấy, độ trong suốt cực kỳ cao. Tôi cho rằng giữa vợ chồng ngoài tấm lòng cởi mở thành thật ra, còn nên có tình yêu bao dung, hai bên đều có quyền giữ lại bí mật và riêng tư cho riêng mình[2].</li></ul><hr><h3>3\\. Phương án lựa chọn A–D</h3>"

        "contentHtml": "<ul><li><strong>A. 难得糊涂</strong> (<em>Nán dé hú tu</em>): Giả vờ ngờ nghệch/mắt nhắm mắt mở, không quá xét nét[3].</li><li><strong>B. 彻底坦白</strong> (<em>Chèdǐ tǎn bái</em>): Thành thật triệt để[3].</li><li><strong>C. 保持新鲜</strong> (<em>Bǎochí xīn xiān</em>): Giữ sự tươi mới[3].</li><li><strong>D. 尊重对方</strong> (<em>Zūn zhòng duì fāng</em>): Tôn trọng đối phương[3].</li></ul><hr><h3>4\\. Đáp án đúng &amp;amp; Giải thích</h3><ul><li><strong>Câu 26: Đáp án D</strong>[3]</li><li><em>Giải thích:</em> Người nữ nói trực tiếp trong bài nghe: \"不愿意说不能算隐私，不能说的才是隐私\" (Không muốn nói không tính là bí mật riêng, không thể nói ra mới là bí mật riêng)[1].</li><li><strong>Câu 27: Đáp án B</strong>[3]</li><li><em>Giải thích:</em> Người nữ khẳng định: \"我觉得没有隐私是坦诚的最高境界，也是婚姻的最高境界\" (Tôi thấy không có bí mật riêng là cảnh giới cao nhất của sự thành thật, cũng là cảnh giới cao nhất của hôn nhân)[1].</li><li><strong>Câu 28: Đáp án A</strong>[3]</li><li><em>Giải thích:</em> Người nam đưa ra ví dụ về loài nhím tụ lại rồi tách ra để rút ra kết luận: \"找到了彼此间的最佳距离... 夫妻之间也情同此理\" (Tìm ra khoảng cách tối ưu giữa nhau... Đạo lý giữa vợ chồng cũng tương tự), tức là nên giữ khoảng cách thích hợp[2].</li><li><strong>Câu 29: Đáp án C</strong>[3]</li><li><em>Giải thích:</em> Người nam giải thích rõ cụm \"恋爱是橱窗\" (Yêu đương là tủ kính trưng bày): \"热恋中的男女都把自己最美好的东西展示给对方\" (Nam nữ lúc yêu đắm say đều phô diễn những gì đẹp đẽ nhất của mình cho đối phương)[2].</li><li><strong>Câu 30: Đáp án A</strong>[3]</li><li><em>Giải thích:</em> Người nam trích dẫn câu nói: \"水至清则无鱼，人至察则无徒，难得糊涂乃是上策。婚姻就要睁一只眼闭一只眼，这样才能保持和谐\" (Nước quá trong thì không có cá, người quá xét nét thì không có bạn, 'hiếm có lúc ngờ nghệch' mới là thượng sách. Hôn nhân cần mắt nhắm mắt mở mới giữ được sự hòa hợp)[2].</li></ul><hr>"

        "contentHtml": "<ul><li><strong>A. 地球位于远日点，北半球是冬季</strong> (<em>Trái Đất ở điểm viễn nhật, Bắc Bán Cầu là mùa đông</em>)</li><li><strong>B. 太阳直射点不同导致地表四季不同</strong> (<em>Điểm chiếu vuông góc Mặt Trời khác nhau dẫn đến bốn mùa trên mặt đất khác nhau</em>)</li><li><strong>C. 地球位置变化导致直射点的变化</strong> (<em>Sự thay đổi vị trí Trái Đất dẫn đến sự thay đổi điểm chiếu vuông góc</em>)</li><li><strong>D. 南、北半球均有明显四季，变化相同</strong> (<em>Hai bán cầu Nam Bắc đều có 4 mùa rõ rệt, biến đổi giống nhau</em>)</li></ul>"

        "number": 33,
        "title": "Câu 33",
        "contentHtml": "<ul><li><strong>A. 南北两极没有四季之分，终年是冬季</strong> (<em>Hai cực Nam Bắc không phân 4 mùa, quanh năm là mùa đông</em>)</li><li><strong>B. 极地年年冬季，但北极温度略高于南极</strong> (<em>Vùng cực quanh năm mùa đông, nhưng nhiệt độ Bắc Cực cao hơn Nam Cực một chút</em>)</li><li><strong>C. 太阳直射赤道，南北半球皆为夏季</strong> (<em>Mặt Trời chiếu thẳng xích đạo, hai bán cầu Nam Bắc đều là mùa hè</em>)</li><li><strong>D. 太阳位置变化导致地表热点的变化</strong> (<em>Sự thay đổi vị trí Mặt Trời dẫn đến sự thay đổi nhiệt lượng trên mặt đất</em>)</li></ul><hr><h3>4\\. Đáp án đúng &amp;amp; Giải thích</h3><ul><li><strong>Câu 31: Đáp án C</strong></li><li><em>Giải thích:</em> Đoạn văn nêu rõ: \"12月22日前后，地球位于近日点，太阳直射南回归线\" (Khoảng ngày 22/12, Mặt Trời chiếu thẳng vào đường chí tuyến Nam)[1].</li><li><strong>Câu 32: Đáp án B</strong></li><li><em>Giải thích:</em> Bài nghe giải thích: \"太阳直射点在地表上也发生了变化，所以各地得到的太阳热量不等，便有了不同的四季\" (Điểm chiếu vuông góc của Mặt Trời thay đổi dẫn đến lượng nhiệt không đều, tạo ra bốn mùa khác nhau)[1].</li><li><strong>Câu 33: Đáp án C</strong></li><li><em>Giải thích:</em> Khi Mặt Trời chiếu thẳng xích đạo (vào tháng 3 và tháng 9), hai bán cầu một bên là Xuân một bên là Thu, không phải cả hai đều là mùa hè (<em>皆为夏季</em> là câu sai so với nội dung bài đọc)[1].</li></ul><hr><p>🎧 Bạn có muốn tiếp tục làm <strong>Câu 34–36 (Bài nghe về Vị quốc vương thử lòng trung thực bằng hạt giống hoa đã luộc)</strong> không?</p><p>Làm tiếp câu 34 đến câu 36 nhé</p><p>Dưới đây là chi tiết phân tích <strong>Câu 34 đến Câu 36 (Đề số 1)</strong> thuộc Phần 3 (Chủ đề: <em>Quốc vương chọn người kế vị bằng chậu hoa rỗng / 国王选子</em>):</p><hr><h3>1\\. Từ vựng trọng tâm</h3><ul><li><strong>义子</strong> (<em>yì zǐ</em>): Con nuôi.</li><li><strong>接班人</strong> (<em>jiē bān rén</em>): Người kế vị, người nối nghiệp.</li><li><strong>无精打采</strong> (<em>wú jīng dǎ cǎi</em>): Ủ rũ, uể oải, mất tinh thần.</li><li><strong>抽泣</strong> (<em>chōu qì</em>): Thút thít, sụt sùi.</li><li><strong>报应</strong> (<em>bào yìng</em>): Quả báo, báo ứng.</li><li><strong>争奇斗艳</strong> (<em>zhēng qí dòu yàn</em>): Đua nhau khoe sắc khoe hương.</li></ul><hr><h3>2\\. Đoạn văn gốc (Bài nghe Câu 34–36)</h3><ul><li><strong>Tiếng Trung nguyên văn:</strong> 从前有一位贤明而受人爱戴的国王，把国家治理得井井有条，使人民安居乐业。</li><li><strong>Pinyin:</strong> Cóngqián yǒu yī wèi xiánmíng ér shòu rén àidài de guówáng, bǎ guójiā zhìlǐ de jǐngjǐng-yǒutiáo, shǐ rénmín ānjū-lèyè.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Ngày xưa có một vị quốc vương hiền minh và được nhân dân kính trọng, ông trị quốc đâu vào đấy, giúp nhân dân an cư lập nghiệp[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 不过国王的年纪渐渐大了，却没有子女，这让国王很伤心。</li><li><strong>Pinyin:</strong> Búguò guówáng de niánjì jiànjiàn dà le, què méiyǒu zǐnǚ, zhè ràng guówáng hěn shāngxīn.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Tuy nhiên tuổi tác của quốc vương ngày một lớn mà lại không có con cái, điều này khiến quốc vương rất đau lòng[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 最后他决定在全国范围内挑选一个孩子收为义子，把他培养成自己的接班人。</li><li><strong>Pinyin:</strong> Zuìhòu tā juédìng zài quánguó fànwéi nèi tiāoxuǎn yī gè háizi shōu wéi yìzǐ, bǎ tā péiyǎng chéng zìjǐ de jiēbānrén.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Cuối cùng ông quyết định chọn một đứa trẻ trên phạm vi toàn quốc nhận làm con nuôi để đào tạo thành người kế vị mình[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 国王选子的标准很独特，他给每个孩子发了一些花的种子，宣布谁用这些种子培育出最美的花朵，谁就是他的义子。</li><li><strong>Pinyin:</strong> Guówáng xuǎn zǐ de biāozhǔn hěn dútè, tā gěi měi gè háizi fā le yīxiē huā de zhǒngzi, xuānbù shéi yòng zhèxiē zhǒngzi péiyù chū zuì měi de huāduǒ, shéi jiùshì tā de yìzǐ.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Tiêu chuẩn chọn con của quốc vương rất độc đáo, ông phát cho mỗi đứa trẻ một ít hạt giống hoa và tuyên bố ai dùng những hạt giống này trồng ra bông hoa đẹp nhất thì sẽ là con nuôi của ông[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 孩子们领回种子后开始了精心的培育，从早到晚浇水施肥松土，谁都希望自己能够成为幸运者。</li><li><strong>Pinyin:</strong> Háizimen lǐng huí zhǒngzi hòu kāishǐ le jīngxīn de péiyù, cóng zǎo dào wǎn jiāoshuǐ shīféi sōngtǔ, shéi dōu xīwàng zìjǐ nénggòu chéngwéi xìngyùnzhě.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Bọn trẻ sau khi nhận hạt giống về bắt đầu chăm sóc hết sức cẩn thận, từ sáng đến tối tưới nước, bón phân, xới đất, ai cũng hy vọng mình sẽ là người may mắn[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 有个男孩也整天精心地培育花种，但是十天过去了，半个月过去了，一个月过去了，花盆里的种子却连芽都没冒出来，更别说开花了。</li><li><strong>Pinyin:</strong> Yǒu gè nánhái yě zhěngtiān jīngxīn de péiyù huā zhǒng, dànshì shí tiān guòqù le, bàn gè yuè guòqù le, yī gè yuè guòqù le, huāpén lǐ de zhǒngzi què lián yá dōu méi mào chūlái, gèng bié shuō kāihuā le.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Có một cậu bé cũng cả ngày chăm chút cho hạt giống, nhưng 10 ngày trôi qua, nửa tháng trôi qua, một tháng trôi qua, hạt giống trong chậu hoa thậm chí còn không nảy mầm, nói gì đến nở hoa[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 苦恼的男孩去请教母亲，母亲建议他把土换一换，但依然无效。</li><li><strong>Pinyin:</strong> Kǔnǎo de nánhái qù qǐngjiào mǔqīn, mǔqīn jiànyì tā bǎ tǔ huàn yī huàn, dàn yīrán wúxiào.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Cậu bé phiền脑 đi hỏi mẹ, người mẹ khuyên cậu đổi đất xem sao, nhưng vẫn không có hiệu quả[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 终于国王观花的日子到了，无数个穿着漂亮衣服的孩子涌上街头，他们各自捧着盛开鲜花的花盆，用期盼的目光看着缓缓巡视的国王。</li><li><strong>Pinyin:</strong> Zhōngyú guówáng guān huā de rìzi dào le, wúshù gè chuān zhe piàoliang yīfu de háizi yǒng shàng jiētóu, tāmen gèzì pěng zhe shèngkāi xiānhuā de huāpén, yòng qīpàn de mùguāng kàn zhe huǎnhuǎn xúnshì de guówáng.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Cuối cùng ngày quốc vương ngắm hoa đã đến, vô số đứa trẻ mặc quần áo đẹp tràn ra đường, mỗi đứa bế một chậu hoa nở rực rỡ, dùng ánh mắt mong chờ nhìn quốc vương đang chậm rãi đi tuần tra[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 国王环视着争奇斗艳的花朵与精神漂亮的孩子们，并没有像大家想象中的那样高兴。</li><li><strong>Pinyin:</strong> Guówáng huánshì zhe zhēngqí-dòuyàn de huāduǒ yǔ jīngshén piàoliang de háizimen, bìng méiyǒu xiàng dàjiā xiǎngxiàng zhōng de nàyàng gāoxìng.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Quốc vương nhìn quanh những bông hoa đua nhau khoe sắc cùng những đứa trẻ rạng rỡ xinh đẹp, nhưng không hề vui vẻ như mọi người tưởng tượng[1].</li><li><strong>Tiếng Trung nguyên văn:</strong> 忽然国王看见了端着空花盆的男孩，他无精打采地站在那里，眼角还有泪花。</li><li><strong>Pinyin:</strong> Hūrán guówáng kànjiàn le duān zhe kōng huāpén de nánhái, tā wújīng-dǎcǎi de zhàn zài nàlǐ, yǎnjiǎo hái yǒu lèihuā.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Đột nhiên quốc vương nhìn thấy cậu bé đang bế chậu hoa rỗng, cậu đứng uể oải ở đó, khóe mắt còn rấn rấn nước mắt[1][2].</li><li><strong>Tiếng Trung nguyên văn:</strong> 国王把他叫到跟前问他：“你为什么端着空花盆呢？”</li><li><strong>Pinyin:</strong> Guówáng bǎ tā jiào dào gēnqián wèn tā: \"Nǐ wèi shénme duān zhe kōng huāpén ne?\"</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Quốc vương gọi cậu đến trước mặt và hỏi: \"Tại sao con lại bế một chậu hoa rỗng?\"[2]</li><li><strong>Tiếng Trung nguyên văn:</strong> 男孩抽泣着把自己精心摆弄，但种子怎么也不发芽的经过说了一遍，还说他想这是报应，因为他曾从别人的花园中偷过一个苹果吃。</li><li><strong>Pinyin:</strong> Nánhái chōuqì zhe bǎ zìjǐ jīngxīn bǎinòng, dàn zhǒngzi zěnme yě bù fāyá de jīngguò shuō le yī biàn, hái shuō tā xiǎng zhè shì bào yìng, yīnwèi tā céng cóng biérén de huāyuán zhōng tōu guò yī gè píngguǒ chī.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Cậu bé thút thít kể lại quá trình mình dày công chăm sóc nhưng hạt giống làm sao cũng không nảy mầm, còn nói cậu nghĩ đây là quả báo vì cậu từng hái trộm một quả táo trong vườn nhà người khác[2].</li><li><strong>Tiếng Trung nguyên văn:</strong> 没想到国王的脸上却露出了最开心的笑容，他把男孩抱起来，高声说：“孩子，我找的就是你！”</li><li><strong>Pinyin:</strong> Méi xiǎngdào guówáng de liǎn shàng què lùchū le zuì kāixīn de xiàoróng, tā bǎ nánhái bào qǐlái, gāoshēng shuō: \"Háizi, wǒ zhǎo de jiùshì nǐ!\"</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Không ngờ trên mặt quốc vương lại nở nụ cười rạng rỡ nhất, ông bế cậu bé lên và nói lớn: \"Con yêu, người ta tìm chính là con!\"[2]</li><li><strong>Tiếng Trung nguyên văn:</strong> 国王给大家说：“我发下的种子全部都是煮过的，根本就不可能发芽开花。”那些捧着鲜花的孩子们一个个都低下了头。</li><li><strong>Pinyin:</strong> Guówáng gěi dàjiā shuō: \"Wǒ fā xià de zhǒngzi quánbù dōu shì zhǔ guò de, gēnběn jiù bù kěnéng fāyá kāihuā.\" Nàxiē pěng zhe xiānhuā de háizimen yī gè gè dōu dī xià le tóu.</li><li><strong>Dịch nghĩa tiếng Việt:</strong> Quốc vương nói với mọi người: \"Hạt giống ta phát ra toàn bộ đều đã luộc qua rồi, vốn dĩ không thể nào nảy mầm nở hoa.\" Những đứa trẻ bế chậu hoa nở rực rỡ kia từng đứa một đều cúi gầm đầu xuống[2].</li></ul><hr><h3>3\\. Câu hỏi và các phương án A–D</h3>"
      },
      {
        "number": 34,
        "title": "Câu 34",
        "contentHtml": "<ul><li><em>Dịch câu hỏi:</em> Tại sao hạt giống của cậu bé không mọc thành hoa tươi?</li><li><strong>A. 培育方法不适当</strong> (<em>Péiyù fāngfǎ bù shìdàng</em>): Phương pháp chăm sóc không thích hợp[3].</li><li><strong>B. 没得到精心照顾</strong> (<em>Méi dédào jīngxīn zhàogù</em>): Không được chăm sóc chu đáo[3].</li><li><strong>C. 花种是被煮过的</strong> (<em>Huāzhǒng shì bèi zhǔ guò de</em>): Hạt giống hoa đã bị luộc chín[3].</li><li><strong>D. 根本没拿到种子</strong> (<em>Gēnběn méi nádào zhǒngzi</em>): Vốn dĩ không nhận được hạt giống[3].</li></ul>"

        "contentHtml": "<ul><li><em>Dịch câu hỏi:</em> Quốc vương chọn cậu bé này là vì:</li><li><strong>A. 男孩流泪了</strong> (<em>Nánhái liúlèi le</em>): Cậu bé rơi nước mắt[3].</li><li><strong>B. 男孩很认真</strong> (<em>Nánhái hěn rènzhēn</em>): Cậu bé rất chăm chỉ/nghiêm túc[3].</li><li><strong>C. 男孩很诚实</strong> (<em>Nánhái hěn chéngshí</em>): Cậu bé rất trung thực[3].</li><li><strong>D. 男孩很可怜</strong> (<em>Nánhái hěn kělián</em>): Cậu bé rất đáng thương[3].</li></ul>"
